<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUDU TUBE</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
header{
  height:70px;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:25px;
  padding:0 25px;
  background:#111116ee;
  backdrop-filter:blur(18px);
  border-bottom:1px solid #292932;
}
.logo{
  font-size:23px;
  font-weight:900;
  white-space:nowrap;
}
.logo b{color:#ff174f}
.search{
  flex:1;
  max-width:650px;
  margin:auto;
  display:flex;
}
.search input{
  width:100%;
  padding:13px 18px;
  background:#202027;
  color:white;
  border:1px solid #383842;
  border-radius:25px 0 0 25px;
  outline:none;
  font-size:15px;
}
.search button{
  width:60px;
  border:0;
  background:#292932;
  color:white;
  border-radius:0 25px 25px 0;
  cursor:pointer;
  font-size:20px;
}
.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#ff174f,#793cff);
  font-weight:bold;
}
.layout{display:flex}
aside{
  width:230px;
  position:fixed;
  top:70px;
  bottom:0;
  padding:18px 12px;
  border-right:1px solid #292932;
  background:#0b0b0f;
}
.nav{
  width:100%;
  padding:13px;
  margin-bottom:5px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#ddd;
  text-align:left;
  cursor:pointer;
  font-size:14px;
}
.nav:hover,.nav.active{
  background:#292932;
  color:white;
}
main{
  margin-left:230px;
  width:calc(100% - 230px);
  padding:25px;
}
.categories{
  display:flex;
  gap:10px;
  overflow:auto;
  margin-bottom:25px;
}
.category{
  white-space:nowrap;
  padding:10px 17px;
  border:0;
  border-radius:9px;
  background:#24242c;
  color:white;
  cursor:pointer;
}
.category:hover{
  background:#fff;
  color:#111;
}
.section-title{
  margin:15px 0 20px;
  font-size:22px;
}
.videos{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px 17px;
}
.card{
  cursor:pointer;
  min-width:0;
}
.thumbnail{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:13px;
  display:block;
}
.info{
  display:flex;
  gap:10px;
  margin-top:11px;
}
.channel-img{
  width:38px;
  height:38px;
  border-radius:50%;
  object-fit:cover;
}
.info h3{
  font-size:14px;
  line-height:1.4;
}
.info p{
  color:#999;
  font-size:12px;
  margin-top:5px;
}
.channel-card{
  display:flex;
  align-items:center;
  gap:15px;
  background:#17171e;
  border:1px solid #292932;
  padding:18px;
  border-radius:15px;
  margin-bottom:15px;
  cursor:pointer;
}
.channel-card img{
  width:65px;
  height:65px;
  border-radius:50%;
}
.channel-card h3{margin-bottom:5px}
.channel-card p{
  color:#999;
  font-size:13px;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#000d;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal.show{display:flex}
.player{
  width:min(950px,100%);
  max-height:95vh;
  overflow:auto;
  background:#15151c;
  border-radius:16px;
  border:1px solid #333;
}
.close{
  float:right;
  margin:12px;
  border:0;
  background:#292932;
  color:white;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
}
iframe{
  width:100%;
  aspect-ratio:16/9;
  border:0;
}
.player-info{
  padding:20px;
}
.player-info h2{margin-bottom:10px}
.player-info p{color:#aaa}
.subscribe{
  margin-top:15px;
  padding:11px 20px;
  border:0;
  border-radius:22px;
  background:#ff174f;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.loading{
  text-align:center;
  padding:50px;
  color:#aaa;
}
.error{
  text-align:center;
  padding:30px;
  color:#ff6b88;
}
@media(max-width:1100px){
  .videos{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:800px){
  header{padding:0 12px;gap:10px}
  .logo{font-size:18px}
  aside{display:none}
  main{
    margin:0;
    width:100%;
    padding:16px 12px 40px;
  }
  .videos{grid-template-columns:repeat(2,1fr);gap:20px 10px}
}
@media(max-width:500px){
  .videos{grid-template-columns:1fr}
  .search input{font-size:13px}
}
</style>

</head>

<body>

<header>

  <div class="logo">
    ▶ GUDU<b>TUBE</b>
  </div>

  <div class="search">
    <input
      id="searchInput"
      placeholder="Search YouTube..."
      onkeydown="if(event.key==='Enter')searchYouTube()"
    >
    <button onclick="searchYouTube()">⌕</button>
  </div>

  <div class="avatar">G</div>

</header>

<div class="layout">

<aside>

<button class="nav active" onclick="home()">⌂ Home</button> <button class="nav" onclick="loadPopular()">🔥 Trending</button> <button class="nav" onclick="searchCategory('Gaming')">🎮 Gaming</button> <button class="nav" onclick="searchCategory('Music')">🎵 Music</button> <button class="nav" onclick="searchCategory('Technology')">💻 Technology</button> <button class="nav" onclick="searchCategory('Sports')">⚽ Sports</button> <button class="nav" onclick="searchCategory('News')">📰 News</button> <button class="nav" onclick="searchCategory('Education')">📚 Education</button>

</aside>

<main>

<div class="categories">
  <button class="category" onclick="loadPopular()">🔥 Popular</button>
  <button class="category" onclick="searchCategory('Gaming')">Gaming</button>
  <button class="category" onclick="searchCategory('Music')">Music</button>
  <button class="category" onclick="searchCategory('Live')">Live</button>
  <button class="category" onclick="searchCategory('Coding')">Coding</button>
  <button class="category" onclick="searchCategory('Minecraft')">Minecraft</button>
  <button class="category" onclick="searchCategory('Football')">Football</button>
</div>

<h2 class="section-title" id="title">
  YouTube Videos
</h2>

<div id="results" class="videos">
  <div class="loading">Loading YouTube videos...</div>
</div>

</main>
</div>

<div class="modal" id="modal">

<div class="player">

<button class="close" onclick="closePlayer()">✕</button>

<iframe
id="youtubePlayer"
allow="autoplay; encrypted-media; picture-in-picture"
allowfullscreen>
</iframe>

<div class="player-info">

<h2 id="playerTitle"></h2>

<p id="playerChannel"></p>

<button class="subscribe" onclick="subscribeChannel()">
  Subscribe on YouTube
</button>

</div>

</div>
</div>

<script>

/*
==================================================
 GUDU TUBE
 YouTube Data API v3
==================================================
*/

const API_KEY = "PASTE_YOUR_YOUTUBE_API_KEY_HERE";

const API =
"https://www.googleapis.com/youtube/v3";


let currentChannel = "";


/* =========================================
   API CHECK
========================================= */

function apiReady(){

  if(
    !API_KEY ||
    API_KEY === "PASTE_YOUR_YOUTUBE_API_KEY_HERE"
  ){

    document.getElementById("results").innerHTML = `
      <div class="error">
        <h2>⚠️ YouTube API Key Missing</h2>
        <p style="margin-top:10px">
        Open index.html and put your YouTube API key
        inside API_KEY.
        </p>
      </div>
    `;

    return false;
  }

  return true;
}


/* =========================================
   SEARCH VIDEOS
========================================= */

async function searchYouTube(){

  if(!apiReady()) return;

  const query =
    document.getElementById("searchInput").value.trim();

  if(!query) return;

  document.getElementById("title").textContent =
    "Results for: " + query;

  document.getElementById("results").innerHTML =
    `<div class="loading">Searching YouTube...</div>`;

  try{

    const url =
      `${API}/search?part=snippet`+
      `&q=${encodeURIComponent(query)}`+
      `&type=video`+
      `&maxResults=24`+
      `&key=${API_KEY}`;

    const response = await fetch(url);

    const data = await response.json();

    if(data.error){
      throw new Error(data.error.message);
    }

    displayVideos(data.items);

  }catch(error){

    document.getElementById("results").innerHTML =
      `<div class="error">❌ ${error.message}</div>`;

  }

}


/* =========================================
   CATEGORY SEARCH
========================================= */

function searchCategory(category){

  document.getElementById("searchInput").value =
    category;

  searchYouTube();

}


/* =========================================
   POPULAR VIDEOS
========================================= */

async function loadPopular(){

  if(!apiReady()) return;

  document.getElementById("title").textContent =
    "Popular YouTube Videos";

  document.getElementById("results").innerHTML =
    `<div class="loading">Loading popular videos...</div>`;

  try{

    const url =
      `${API}/videos?part=snippet,statistics`+
      `&chart=mostPopular`+
      `&regionCode=ES`+
      `&maxResults=24`+
      `&key=${API_KEY}`;

    const response = await fetch(url);

    const data = await response.json();

    if(data.error){
      throw new Error(data.error.message);
    }

    displayPopular(data.items);

  }catch(error){

    document.getElementById("results").innerHTML =
      `<div class="error">❌ ${error.message}</div>`;

  }

}


/* =========================================
   DISPLAY SEARCH RESULTS
========================================= */

function displayVideos(items){

  const container =
    document.getElementById("results");

  if(!items || items.length === 0){

    container.innerHTML =
      `<div class="error">No videos found.</div>`;

    return;
  }

  container.innerHTML =
    items.map(item=>{

      const video = item.id.videoId;

      const snippet = item.snippet;

      return `

      <div
        class="card"
        onclick="openVideo(
          '${video}',
          '${escapeText(snippet.title)}',
          '${escapeText(snippet.channelTitle)}',
          '${snippet.channelId}'
        )"
      >

        <img
          class="thumbnail"
          src="${snippet.thumbnails.high.url}"
          loading="lazy"
        >

        <div class="info">

          <img
            class="channel-img"
            src="${snippet.thumbnails.default.url}"
          >

          <div>

            <h3>
              ${escapeHTML(snippet.title)}
            </h3>

            <p>
              ${escapeHTML(snippet.channelTitle)}
            </p>

            <p>
              ${formatDate(snippet.publishedAt)}
            </p>

          </div>

        </div>

      </div>

      `;

    }).join("");

}


/* =========================================
   DISPLAY POPULAR
========================================= */

function displayPopular(items){

  const container =
    document.getElementById("results");

  container.innerHTML =
    items.map(item=>{

      const snippet = item.snippet;

      return `

      <div
        class="card"
        onclick="openVideo(
          '${item.id}',
          '${escapeText(snippet.title)}',
          '${escapeText(snippet.channelTitle)}',
          '${snippet.channelId}'
        )"
      >

        <img
          class="thumbnail"
          src="${snippet.thumbnails.high.url}"
          loading="lazy"
        >

        <div class="info">

          <img
            class="channel-img"
            src="${snippet.thumbnails.default.url}"
          >

          <div>

            <h3>
              ${escapeHTML(snippet.title)}
            </h3>

            <p>
              ${escapeHTML(snippet.channelTitle)}
            </p>

            <p>
              ${item.statistics?.viewCount
                ? formatViews(item.statistics.viewCount)
                : ""
              }
            </p>

          </div>

        </div>

      </div>

      `;

    }).join("");

}


/* =========================================
   VIDEO PLAYER
========================================= */

function openVideo(
  id,
  title,
  channel,
  channelId
){

  currentChannel = channelId;

  document.getElementById("modal")
    .classList.add("show");

  document.getElementById("youtubePlayer").src =
    `https://www.youtube.com/embed/${id}?autoplay=1`;

  document.getElementById("playerTitle")
    .textContent = title;

  document.getElementById("playerChannel")
    .textContent = channel;

}


/* =========================================
   CLOSE PLAYER
========================================= */

function closePlayer(){

  document.getElementById("modal")
    .classList.remove("show");

  document.getElementById("youtubePlayer").src =
    "";

}


/* =========================================
   SUBSCRIBE
========================================= */

function subscribeChannel(){

  if(!currentChannel) return;

  window.open(
    `https://www.youtube.com/channel/${currentChannel}`,
    "_blank"
  );

}


/* =========================================
   HOME
========================================= */

function home(){

  document.getElementById("searchInput").value = "";

  document.getElementById("title").textContent =
    "Popular YouTube Videos";

  loadPopular();

}


/* =========================================
   HELPERS
========================================= */

function formatDate(date){

  return new Date(date).toLocaleDateString();

}


function formatViews(number){

  return Number(number).toLocaleString() +
    " views";

}


function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeText(text){

  return text
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n"," ");

}


/* =========================================
   START
========================================= */

loadPopular();

</script>

</body>
</html>
