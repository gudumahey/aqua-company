
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUDU TUBE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f0f;--panel:#181818;--text:#f5f5f5;--muted:#aaa;--accent:#ff3030}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:inherit;border:0}
header{height:66px;display:flex;align-items:center;gap:22px;padding:0 22px;background:#101010;position:sticky;top:0;z-index:5;border-bottom:1px solid #252525}
.logo{font-size:23px;font-weight:900;white-space:nowrap;letter-spacing:-1px}
.logo span{background:var(--accent);padding:7px 9px;border-radius:10px;margin-right:5px}
.search{display:flex;max-width:650px;flex:1;margin:auto}
.search input{width:100%;background:#202020;border:1px solid #383838;color:white;padding:12px 18px;border-radius:25px 0 0 25px;outline:none}
.search button{background:#303030;padding:0 22px;border-radius:0 25px 25px 0}
.circle{background:#252525;border-radius:50%;width:42px;height:42px;flex-shrink:0}
.layout{display:flex}
aside{width:225px;padding:16px 12px;position:fixed;top:66px;bottom:0;overflow:auto}
.nav{display:flex;align-items:center;gap:20px;padding:13px 14px;border-radius:12px;color:#eee;text-decoration:none;cursor:pointer}
.nav:hover,.nav.active{background:#303030}
.nav .ico{font-size:21px;width:24px;text-align:center}
main{margin-left:225px;width:calc(100% - 225px);padding:18px 25px 50px}
.categories{display:flex;gap:10px;overflow:auto;padding:0 0 24px;scrollbar-width:none}
.chip{background:#272727;padding:10px 16px;border-radius:9px;white-space:nowrap}
.chip.active,.chip:hover{background:#f2f2f2;color:#111}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 18px}
.video{min-width:0;cursor:pointer}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:13px;background:#222;transition:.2s}
.video:hover .thumb{border-radius:7px;filter:brightness(1.1)}
.details{display:flex;gap:12px;margin-top:12px}
.avatar{width:39px;height:39px;border-radius:50%;background:linear-gradient(135deg,#ff3030,#773bff);display:grid;place-items:center;font-weight:bold;flex-shrink:0}
.vtitle{font-weight:600;font-size:15px;line-height:1.45;margin-bottom:7px}
.meta{color:var(--muted);font-size:13px;line-height:1.6}
#playerPage{display:none}
.back{background:#282828;padding:10px 15px;border-radius:8px;margin-bottom:15px}
.player{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.playerTitle{font-size:23px;margin:15px 0}
.playerMeta{color:var(--muted);margin-bottom:20px}
.description{background:#202020;border-radius:12px;padding:18px;line-height:1.7}
.empty{padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}
footer{color:#777;font-size:12px;padding:25px 10px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}aside{width:190px}main{margin-left:190px;width:calc(100% - 190px)}}
@media(max-width:650px){
 header{padding:0 10px;gap:10px;height:58px}.logo{font-size:18px}.logo span{padding:6px}
 .search input{min-width:0;padding:10px}.search button{padding:0 12px}
 aside{width:65px;padding:12px 5px}aside .label,aside hr{display:none}
 .nav{justify-content:center;padding:13px 0}.nav .ico{font-size:22px}
 main{margin-left:65px;width:calc(100% - 65px);padding:13px 10px}
 .grid{grid-template-columns:1fr;gap:25px}.categories{padding-bottom:18px}
 .circle{width:35px;height:35px}
}
</style>
</head>
<body>
<header>
  <button class="circle" onclick="toggleSidebar()" title="Toggle menu">☰</button>
  <div class="logo"><span>▶</span> GUDU TUBE</div>
  <form class="search" id="searchForm">
    <input id="searchInput" placeholder="Search videos..." autocomplete="off">
    <button type="submit">🔍</button>
  </form>
  <button class="circle" onclick="showHome()" title="Home">⌂</button>
</header>

<div class="layout">
<aside id="sidebar">
  <a class="nav active" onclick="showHome()"><span class="ico">⌂</span><span class="label">Home</span></a>
  <a class="nav" onclick="filterCategory('Shorts')"><span class="ico">⚡</span><span class="label">Shorts</span></a>
  <a class="nav" onclick="filterCategory('Gaming')"><span class="ico">🎮</span><span class="label">Gaming</span></a>
  <a class="nav" onclick="filterCategory('Music')"><span class="ico">♫</span><span class="label">Music</span></a>
  <a class="nav" onclick="filterCategory('Education')"><span class="ico">📚</span><span class="label">Education</span></a>
  <hr style="border-color:#333;margin:14px 8px">
  <a class="nav" onclick="showHome()"><span class="ico">▶</span><span class="label">All videos</span></a>
  <a class="nav" onclick="showHistory()"><span class="ico">◷</span><span class="label">Watch history</span></a>
  <footer>GUDU TUBE<br>Independent demo website<br>© 2026</footer>
</aside>

<main>
  <section id="homePage">
    <div class="categories" id="categories">
      <button class="chip active" onclick="filterCategory('All',this)">All</button>
      <button class="chip" onclick="filterCategory('Gaming',this)">🎮 Gaming</button>
      <button class="chip" onclick="filterCategory('Music',this)">🎵 Music</button>
      <button class="chip" onclick="filterCategory('Technology',this)">💻 Technology</button>
      <button class="chip" onclick="filterCategory('Education',this)">📚 Education</button>
      <button class="chip" onclick="filterCategory('Shorts',this)">⚡ Shorts</button>
      <button class="chip" onclick="filterCategory('Entertainment',this)">🎬 Entertainment</button>
    </div>
    <div class="grid" id="videoGrid"></div>
  </section>

  <section id="playerPage">
    <button class="back" onclick="showHome()">← Back to videos</button>
    <div id="playerContent"></div>
  </section>
</main>
</div>

<script>
const videos = [
 {id:'aqz-KE-bpKQ',title:'Big Buck Bunny - Open Movie',channel:'Open Movie Project',views:'Demo video',category:'Entertainment',thumb:'https://img.youtube.com/vi/aqz-KE-bpKQ/hqdefault.jpg'},
 {id:'jNQXAC9IVRw',title:'Me at the zoo - Classic YouTube Video',channel:'jawed',views:'Classic video',category:'Entertainment',thumb:'https://img.youtube.com/vi/jNQXAC9IVRw/hqdefault.jpg'},
 {id:'ScMzIvxBSi4',title:'Relaxing Video and Chill Time',channel:'Video World',views:'Demo video',category:'Music',thumb:'https://img.youtube.com/vi/ScMzIvxBSi4/hqdefault.jpg'},
 {id:'M7lc1UVf-VE',title:'YouTube Player Demo',channel:'YouTube Developers',views:'Demo video',category:'Technology',thumb:'https://img.youtube.com/vi/M7lc1UVf-VE/hqdefault.jpg'},
 {id:'ysz5S6PUM-U',title:'Sample Video - Creative Ideas',channel:'Creative Studio',views:'Demo video',category:'Education',thumb:'https://img.youtube.com/vi/ysz5S6PUM-U/hqdefault.jpg'},
 {id:'L_jWHffIx5E',title:'Music Video Sample',channel:'Music Zone',views:'Demo video',category:'Music',thumb:'https://img.youtube.com/vi/L_jWHffIx5E/hqdefault.jpg'},
 {id:'kJQP7kiw5Fk',title:'Popular Music Video Sample',channel:'Music Channel',views:'Demo video',category:'Music',thumb:'https://img.youtube.com/vi/kJQP7kiw5Fk/hqdefault.jpg'},
 {id:'dQw4w9WgXcQ',title:'Internet Video Classic',channel:'Video Classics',views:'Classic video',category:'Entertainment',thumb:'https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg'},
 {id:'BaW_jenozKc',title:'Travel and Adventure Video',channel:'Travel World',views:'Demo video',category:'Education',thumb:'https://img.youtube.com/vi/BaW_jenozKc/hqdefault.jpg'},
 {id:'C0DPdy98e4c',title:'Gaming and Fun',channel:'Game Zone',views:'Demo video',category:'Gaming',thumb:'https://img.youtube.com/vi/C0DPdy98e4c/hqdefault.jpg'},
 {id:'tgbNymZ7vqY',title:'Funny Moments',channel:'Fun Videos',views:'Demo video',category:'Entertainment',thumb:'https://img.youtube.com/vi/tgbNymZ7vqY/hqdefault.jpg'},
 {id:'ScMzIvxBSi4',title:'Short Clip and Highlights',channel:'Short Clips',views:'Demo video',category:'Shorts',thumb:'https://img.youtube.com/vi/ScMzIvxBSi4/hqdefault.jpg'}
];

const grid = document.getElementById('videoGrid');
let currentVideos = [...videos];

function render(list){
 currentVideos=list;
 grid.innerHTML='';
 if(!list.length){grid.innerHTML='<div class="empty">😕 No videos found. Try another search.</div>';return}
 list.forEach((v)=>{
  const card=document.createElement('article');
  card.className='video';
  card.innerHTML=`
   <img class="thumb" src="${v.thumb}" alt="" loading="lazy">
   <div class="details">
    <div class="avatar">${v.channel.charAt(0)}</div>
    <div><div class="vtitle"></div>
    <div class="meta"></div></div>
   </div>`;
  card.querySelector('.vtitle').textContent=v.title;
  card.querySelector('.meta').textContent=v.channel+' · '+v.views;
  card.onclick=()=>openVideo(v);
  grid.appendChild(card);
 });
}

function openVideo(v){
 document.getElementById('homePage').style.display='none';
 document.getElementById('playerPage').style.display='block';
 document.getElementById('playerContent').innerHTML=`
  <iframe class="player" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=1" title="Video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  <h2 class="playerTitle"></h2>
  <div class="playerMeta"></div>
  <div class="description"><b>About this video</b><br>Welcome to GUDU TUBE! Enjoy watching videos. This is a demo video page.</div>`;
 document.querySelector('.playerTitle').textContent=v.title;
 document.querySelector('.playerMeta').textContent=v.channel+' · '+v.category;
 window.scrollTo(0,0);
}

function showHome(){
 document.getElementById('homePage').style.display='block';
 document.getElementById('playerPage').style.display='none';
 document.getElementById('playerContent').innerHTML='';
 render(videos);
 window.scrollTo(0,0);
}

function filterCategory(category,button){
 document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
 if(button)button.classList.add('active');
 const list=category==='All'?videos:videos.filter(v=>v.category===category);
 render(list);
 document.getElementById('homePage').style.display='block';
 document.getElementById('playerPage').style.display='none';
}

document.getElementById('searchForm').addEventListener('submit',e=>{
 e.preventDefault();
 const q=document.getElementById('searchInput').value.trim().toLowerCase();
 render(videos.filter(v=>(v.title+' '+v.channel+' '+v.category).toLowerCase().includes(q)));
 document.getElementById('homePage').style.display='block';
 document.getElementById('playerPage').style.display='none';
});

function showHistory(){
 alert('Watch history is not saved in this demo yet.');
}

function toggleSidebar(){
 const s=document.getElementById('sidebar');
 if(s.style.display==='none'){s.style.display='';}
 else{s.style.display='none';}
 document.querySelector('main').style.marginLeft=s.style.display==='none'?'0':'';
 document.querySelector('main').style.width=s.style.display==='none'?'100%':'';
}
render(videos);
</script>
</body>
</html>
