<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OfficeFlow — Visitor Management</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

:root{
  --primary:#4f46e5;
  --primary2:#6366f1;
  --dark:#111827;
  --muted:#697386;
  --border:#e5e7eb;
  --white:#fff;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#d97706;
}

.hidden{display:none!important}

/* LOGIN */
.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,#dfe3ff,transparent 35%),
    radial-gradient(circle at 80% 80%,#e4e9ff,transparent 35%),
    #f6f7fb;
}
.login-card{
  width:100%;
  max-width:460px;
  background:white;
  border:1px solid var(--border);
  border-radius:24px;
  padding:38px;
  box-shadow:0 25px 70px #1f29371a;
}
.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  font-size:23px;
}
.logo-box{
  width:44px;height:44px;
  border-radius:13px;
  display:grid;
  place-items:center;
  color:white;
  background:linear-gradient(135deg,var(--primary),#7c3aed);
}
.login-card h1{
  margin-top:32px;
  font-size:30px;
}
.login-card p{
  color:var(--muted);
  margin:8px 0 25px;
}

/* APP */
.app{display:none;min-height:100vh}
.sidebar{
  position:fixed;
  left:0;top:0;bottom:0;
  width:255px;
  background:#111827;
  color:white;
  padding:24px 16px;
  z-index:20;
}
.sidebar .logo{padding:0 10px 35px}
.sidebar .logo-box{background:linear-gradient(135deg,#6366f1,#8b5cf6)}

.nav-title{
  color:#788196;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:0 12px;
  margin:20px 0 8px;
}
.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#aeb7c8;
  padding:12px;
  border-radius:10px;
  text-align:left;
  margin:2px 0;
}
.nav button:hover,.nav button.active{
  color:white;
  background:#ffffff12;
}
.nav button span{margin-right:10px}

.main{
  margin-left:255px;
  min-height:100vh;
}
.topbar{
  height:76px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 35px;
  position:sticky;
  top:0;
  z-index:10;
}
.topbar h2{font-size:20px}
.user{
  display:flex;
  align-items:center;
  gap:10px;
}
.avatar{
  width:38px;height:38px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#ede9fe;
  color:#5b21b6;
  font-weight:800;
}
.content{padding:32px}

.hero{
  background:linear-gradient(135deg,#111827,#312e81);
  color:white;
  border-radius:20px;
  padding:30px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
  margin-bottom:25px;
}
.hero h1{font-size:27px;margin-bottom:8px}
.hero p{color:#c7cbd8}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-weight:700;
}
.btn-primary{
  color:white;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
}
.btn-dark{background:#111827;color:white}
.btn-light{background:white;color:#111827;border:1px solid var(--border)}
.btn-green{background:#dcfce7;color:#166534}
.btn-red{background:#fee2e2;color:#991b1b}
.btn-orange{background:#fef3c7;color:#92400e}
.btn:hover{transform:translateY(-1px)}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:25px;
}
.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
}
.stat small{color:var(--muted)}
.stat strong{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px;
  margin-bottom:20px;
}
.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.card-head h3{font-size:17px}

table{width:100%;border-collapse:collapse}
th,td{
  padding:14px 10px;
  text-align:left;
  border-bottom:1px solid #edf0f4;
  font-size:13px;
}
th{color:#7a8496;font-size:11px;text-transform:uppercase}
td strong{font-size:13px}

.badge{
  display:inline-flex;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}
.pending{background:#fef3c7;color:#92400e}
.approved{background:#dbeafe;color:#1d4ed8}
.rejected{background:#fee2e2;color:#991b1b}
.registered{background:#ede9fe;color:#6d28d9}
.checked{background:#dcfce7;color:#166534}
.out{background:#f1f5f9;color:#475569}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}
.form-group{display:flex;flex-direction:column;gap:7px}
.form-group.full{grid-column:1/-1}
.form-group label{
  font-size:12px;
  font-weight:700;
  color:#4b5563;
}
.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  border:1px solid #dce1e8;
  border-radius:10px;
  padding:12px;
  outline:none;
  background:white;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px #4f46e51a;
}
textarea{min-height:100px;resize:vertical}

.section-title{
  font-size:14px;
  font-weight:800;
  margin:27px 0 15px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
}
.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:25px;
}

.otp-box{
  background:#f8fafc;
  border:1px solid var(--border);
  padding:20px;
  border-radius:15px;
  margin-top:15px;
}
.otp-box input{
  text-align:center;
  font-size:24px;
  letter-spacing:8px;
}
.verified{
  color:#15803d;
  font-weight:700;
  margin-top:10px;
}

.mobile-menu{display:none}

@media(max-width:950px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .mobile-menu{display:block}
  .stats{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:650px){
  .content{padding:18px}
  .topbar{padding:0 18px}
  .hero{flex-direction:column;align-items:flex-start}
  .stats{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:auto}
  table{min-width:700px}
  .card{overflow:auto}
}
</style>
</head>

<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  doc,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* =========================================================
   🔥 PASTE YOUR FIREBASE CONFIG HERE
   ========================================================= */

const firebaseConfig = {

  apiKey: "PASTE_API_KEY",

  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",

  projectId: "PASTE_PROJECT_ID",

  storageBucket: "PASTE_PROJECT_ID.firebasestorage.app",

  messagingSenderId: "PASTE_MESSAGING_SENDER_ID",

  appId: "PASTE_APP_ID"

};


/* FIREBASE START */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================================================
   NAVIGATION
   ========================================================= */

window.showPage = function(page){

  const titles = {

    dashboard:"Dashboard",

    appointments:"Appointments",

    visitors:"Visitors",

    newAppointment:"New Appointment",

    employees:"Employees",

    reports:"Reports",

    settings:"Settings"

  };

  document.getElementById("pageTitle")
    .innerText = titles[page] || "Dashboard";

  document.querySelectorAll(".nav button")
    .forEach(x=>x.classList.remove("active"));

  const nav =
    document.getElementById("nav-"+page);

  if(nav) nav.classList.add("active");

  if(page==="dashboard") renderDashboard();

  if(page==="appointments") renderAppointments();

  if(page==="visitors") renderVisitors();

  if(page==="newAppointment") renderAppointmentForm();

  if(page==="employees") renderEmployees();

  if(page==="reports") renderReports();

  if(page==="settings") renderSettings();

};

`;

/* =========================================================
   SUBMIT APPOINTMENT
   ========================================================= */

async function submitAppointment(e){

e.preventDefault();

const form =
new FormData(e.target);

const data =
Object.fromEntries(form.entries());

data.phone =
auth.currentUser?.phoneNumber || "";

data.status = "Pending";

data.createdAt =
new Date().toISOString();

data.appointmentId =
"APT-"+Date.now();

try{

await addDoc(
collection(db,"appointments"),
data
);

alert(
"Application submitted successfully!\n\n"+
"Your Appointment ID:\n"+
data.appointmentId
);

e.target.reset();

showPage("appointments");

}catch(error){

console.error(error);

alert(
"Could not submit application:\n"+
error.message
);

}

}

</div>

</div>

/* =========================================================
   APPOINTMENTS
   ========================================================= */

async function renderAppointments(){

document.getElementById("content").innerHTML = `

<div class="card">

<div class="card-head">

<h3>Appointment Requests</h3>

<button class="btn btn-primary"
onclick="showPage('newAppointment')">
+ New Appointment
</button>

</div>

<div id="appointmentTable">
Loading...
</div>

</div>
`;

try{

const snap =
await getDocs(collection(db,"appointments"));

let html=`

<table>

<thead>

<tr>
<th>ID</th>
<th>Visitor</th>
<th>Meeting</th>
<th>Date</th>
<th>Status</th>
<th>Actions</th>
</tr>

</thead>

<tbody>
`;

snap.forEach(item=>{

const d=item.data();

let badge=d.status.toLowerCase();

if(badge==="checked in") badge="checked";

html+=`

<tr>

<td>
<strong>${d.appointmentId||item.id}</strong>
</td>

<td>
<strong>${d.name||"—"}</strong><br>
<small>${d.phone||""}</small>
</td>

<td>
${d.personToVisit||"—"}<br>
<small>${d.department||""}</small>
</td>

<td>
${d.date||"—"}<br>
<small>${d.time||""}</small>
</td>

<td>
<span class="badge ${badge}">
${d.status||"Pending"}
</span>
</td>

<td>

${d.status==="Pending"
?
`
<button class="btn btn-green"
onclick="approveAppointment('${item.id}')">
Approve
</button>

<button class="btn btn-red"
onclick="rejectAppointment('${item.id}')">
Reject
</button>
`
:
`
<button class="btn btn-light"
onclick="viewAppointment('${item.id}')">
View
</button>
`
}

</td>

</tr>
`;

});

html+=`</tbody></table>`;

document.getElementById("appointmentTable")
.innerHTML=html;

}catch(error){

document.getElementById("appointmentTable").innerHTML =
`<p style="color:#dc2626">${error.message}</p>`;

}

}


/* =========================================================
   APPROVE / REJECT
   ========================================================= */

window.approveAppointment = async function(id){

if(!confirm("Approve this appointment?")) return;

await updateDoc(
doc(db,"appointments",id),
{
status:"Approved",
approvedAt:new Date().toISOString()
}
);

renderAppointments();

};


window.rejectAppointment = async function(id){

if(!confirm("Reject this appointment?")) return;

await updateDoc(
doc(db,"appointments",id),
{
status:"Rejected",
rejectedAt:new Date().toISOString()
}
);

renderAppointments();

};


/* =========================================================
   VIEW APPOINTMENT
   ========================================================= */

window.viewAppointment = async function(id){

const snap =
await getDocs(collection(db,"appointments"));

let d=null;

snap.forEach(x=>{

if(x.id===id)
d=x.data();

});

if(!d)return;

alert(
"APPOINTMENT\n\n"+
"ID: "+d.appointmentId+
"\nName: "+d.name+
"\nPhone: "+d.phone+
"\nEmail: "+d.email+
"\nMeeting: "+d.personToVisit+
"\nDepartment: "+d.department+
"\nDate: "+d.date+
"\nTime: "+d.time+
"\nReason: "+d.reason+
"\nPurpose: "+d.purpose+
"\nStatus: "+d.status
);

};
