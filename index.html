<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>OfficeFlow — Reception & Visitor Management</title>
<style>
:root{
  --blue:#1a73e8;--blue2:#0b57d0;--text:#202124;--muted:#5f6368;
  --bg:#f8fafd;--card:#fff;--border:#e4e7eb;--green:#188038;--red:#d93025;
  --shadow:0 1px 2px rgba(60,64,67,.12),0 2px 8px rgba(60,64,67,.08);
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;background:#fff;border-right:1px solid var(--border);padding:22px 14px;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:4px 12px 24px;font-size:20px;font-weight:700}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#1a73e8,#5b9df9);color:#fff;display:grid;place-items:center;font-weight:800}
.nav-label{font-size:11px;color:#8a9098;text-transform:uppercase;letter-spacing:.09em;padding:12px 12px 7px}
.nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:10px;color:#4a4f55;margin:2px 0;display:flex;gap:12px;align-items:center}
.nav button:hover{background:#f1f3f4}.nav button.active{background:#e8f0fe;color:#1967d2;font-weight:600}.nav-icon{width:20px;text-align:center}
.profile-mini{position:absolute;bottom:18px;left:14px;right:14px;border-top:1px solid var(--border);padding:16px 8px 0;display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:#e8f0fe;color:#1967d2;display:grid;place-items:center;font-weight:700}
.profile-mini small{color:var(--muted)}.main{margin-left:248px;min-height:100vh}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}
.top-left{display:flex;align-items:center;gap:14px}.menu{display:none;border:0;background:#fff;font-size:22px}.search{width:min(390px,40vw);background:#f1f3f4;border:1px solid transparent;border-radius:10px;padding:10px 14px;outline:0}.search:focus{background:#fff;border-color:#a8c7fa}
.top-actions{display:flex;align-items:center;gap:12px}.icon-btn{width:38px;height:38px;border:0;border-radius:50%;background:#f1f3f4}.content{padding:30px;max-width:1500px;margin:auto}
.page-head{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:25px}.page-head h1{margin:0;font-size:28px}.page-head p{margin:6px 0 0;color:var(--muted)}
.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:600}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue2)}.btn-light{background:#f1f3f4;color:#3c4043}.btn-danger{background:#fce8e6;color:#c5221f}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}.pad{padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.stat{padding:20px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.stat-top{display:flex;justify-content:space-between;align-items:center}.stat small{color:var(--muted)}.stat strong{display:block;font-size:30px;margin-top:8px}.stat-icon{width:42px;height:42px;border-radius:11px;background:#e8f0fe;color:#1967d2;display:grid;place-items:center}
.grid2{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.section-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}.section-head h3{margin:0;font-size:16px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 18px;border-bottom:1px solid #eef0f2;font-size:14px;white-space:nowrap}th{font-size:12px;color:#6b7077;text-transform:uppercase;letter-spacing:.04em;background:#fafbfc}tr:last-child td{border-bottom:0}
.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:600}.approved{background:#e6f4ea;color:#137333}.pending{background:#fef7e0;color:#b06000}.rejected{background:#fce8e6;color:#c5221f}.checked{background:#e8f0fe;color:#1967d2}
.activity{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #eef0f2}.activity:last-child{border-bottom:0}.activity-dot{width:9px;height:9px;border-radius:50%;background:#1a73e8;margin-top:6px}.activity p{margin:0;font-size:14px}.activity small{color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:600;color:#4b5056}.field input,.field select,.field textarea{border:1px solid #dadce0;border-radius:9px;padding:11px 12px;outline:0;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:#1a73e8;box-shadow:0 0 0 2px #e8f0fe}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.portal{display:none;min-height:100vh;background:linear-gradient(135deg,#f8fbff,#eef5ff);padding:30px}.portal-card{max-width:760px;margin:20px auto;background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:0 8px 35px rgba(32,33,36,.10);padding:30px}.portal-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;margin-bottom:30px}.portal h1{font-size:30px;margin:0 0 8px}.portal p{color:var(--muted)}
.notice{padding:13px 15px;border-radius:10px;background:#e8f0fe;color:#174ea6;margin:15px 0;font-size:14px}
.chat-layout{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 130px);min-height:520px}.chat-users{border-right:1px solid var(--border);overflow:auto}.user{padding:13px 15px;display:flex;gap:10px;align-items:center;cursor:pointer}.user:hover,.user.active{background:#f1f3f4}.user strong{font-size:14px}.user small{color:var(--muted)}.chat-main{display:flex;flex-direction:column}.chat-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px}.chat-messages{flex:1;overflow:auto;padding:22px;background:#f8fafd}.msg{max-width:70%;margin-bottom:12px}.msg.me{margin-left:auto}.bubble{background:#fff;border:1px solid var(--border);padding:10px 13px;border-radius:13px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.me .bubble{background:#e8f0fe;border-color:#d2e3fc}.msg small{display:block;color:#7b8188;font-size:10px;margin-top:4px}.chat-form{display:flex;gap:9px;padding:14px;border-top:1px solid var(--border)}.chat-form input{flex:1;border:1px solid #dadce0;border-radius:22px;padding:11px 15px}
.toast{position:fixed;right:24px;bottom:24px;background:#202124;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.2);z-index:99;display:none}.empty{padding:45px;text-align:center;color:var(--muted)}
@media(max-width:1000px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.menu{display:block}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:650px){.content{padding:18px}.topbar{padding:0 15px}.search{display:none}.stats{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.chat-layout{grid-template-columns:1fr}.chat-users{display:none}.chat-messages{padding:15px}.msg{max-width:85%}.portal{padding:12px}.portal-card{padding:22px}}
</style>
</head>
<body>

<div id="portal" class="portal">
  <div class="portal-card">
    <div class="portal-brand"><div class="brand-mark">OF</div> OfficeFlow</div>
    <h1>Request a Visit</h1>
    <p>Complete the form below and Reception will review your appointment request.</p>
    <div class="notice">No mobile verification is required. Please provide accurate visit details.</div>
    <form id="visitorForm">
      <div class="form-grid">
        <div class="field"><label>Full Name</label><input id="vName" required placeholder="Your full name"></div>
        <div class="field"><label>Email</label><input id="vEmail" type="email" required placeholder="name@example.com"></div>
        <div class="field"><label>Mobile Number</label><input id="vPhone" placeholder="+34 600 000 000"></div>
        <div class="field"><label>Person to Visit</label><select id="vPerson" required></select></div>
        <div class="field"><label>Department</label><select id="vDept" required><option>Finance</option><option>Human Resources</option><option>IT</option><option>Management</option><option>Sales</option><option>Operations</option></select></div>
        <div class="field"><label>Date</label><input id="vDate" type="date" required></div>
        <div class="field"><label>Time</label><input id="vTime" type="time" required></div>
        <div class="field full"><label>Detailed Purpose</label><textarea id="vPurpose" rows="5" required placeholder="Please describe the purpose of your visit in detail..."></textarea></div>
      </div>
      <div class="form-actions"><button class="btn btn-primary" type="submit">Submit Request</button></div>
    </form>
  </div>
</div>

<div id="app" class="app">
<aside id="sidebar" class="sidebar">
  <div class="brand"><div class="brand-mark">OF</div> OfficeFlow</div>
  <div class="nav">
    <div class="nav-label">Workspace</div>
    <button data-page="dashboard" onclick="showPage('dashboard')"><span class="nav-icon">▦</span>Dashboard</button>
    <button data-page="appointments" onclick="showPage('appointments')"><span class="nav-icon">◷</span>Appointments</button>
    <button data-page="visitors" onclick="showPage('visitors')"><span class="nav-icon">♙</span>Visitors</button>
    <button data-page="new" onclick="showPage('new')"><span class="nav-icon">＋</span>New Appointment</button>
    <div class="nav-label">Management</div>
    <button data-page="employees" onclick="showPage('employees')"><span class="nav-icon">👥</span>Employees</button>
    <button data-page="chat" onclick="showPage('chat')"><span class="nav-icon">💬</span>Staff Chat</button>
    <button data-page="reports" onclick="showPage('reports')"><span class="nav-icon">▥</span>Reports</button>
    <button data-page="settings" onclick="showPage('settings')"><span class="nav-icon">⚙</span>Settings</button>
  </div>
  <div class="profile-mini"><div class="avatar">RA</div><div><strong>Reception Admin</strong><br><small>Reception</small></div></div>
</aside>

<main class="main">
<header class="topbar">
  <div class="top-left"><button class="menu" onclick="toggleSidebar()">☰</button><input class="search" id="globalSearch" placeholder="Search visitors, appointments..."></div>
  <div class="top-actions"><button class="icon-btn" onclick="notify('No new notifications')">🔔</button><div class="avatar">RA</div></div>
</header>
<div id="content" class="content"></div>
</main>
</div>

<div id="toast" class="toast"></div>

<script>
const employees=[
 {name:"Alex Johnson",role:"Office Manager",dept:"Management",email:"alex@office.com"},
 {name:"Maria Garcia",role:"HR Manager",dept:"Human Resources",email:"maria@office.com"},
 {name:"Daniel Smith",role:"IT Specialist",dept:"IT",email:"daniel@office.com"},
 {name:"Sofia Martinez",role:"Finance Manager",dept:"Finance",email:"sofia@office.com"},
 {name:"James Wilson",role:"Sales Director",dept:"Sales",email:"james@office.com"},
 {name:"Emma Davis",role:"Operations Manager",dept:"Operations",email:"emma@office.com"}
];

let appointments=JSON.parse(localStorage.getItem("officeflow_appointments")||"[]");
let messages=JSON.parse(localStorage.getItem("officeflow_messages")||"[]");
let currentChat="All Staff";

function save(){localStorage.setItem("officeflow_appointments",JSON.stringify(appointments));localStorage.setItem("officeflow_messages",JSON.stringify(messages))}
function notify(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>x.style.display="none",2500)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function badge(s){let c=s==="Approved"?"approved":s==="Rejected"?"rejected":s==="Checked In"?"checked":"pending";return `<span class="badge ${c}">${esc(s)}</span>`}
function initials(n){return n.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase()}

function showPage(page){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 if(innerWidth<1000) document.getElementById("sidebar").classList.remove("open");
 ({dashboard:renderDashboard,appointments:renderAppointments,visitors:renderVisitors,new:renderNew,employees:renderEmployees,chat:renderChat,reports:renderReports,settings:renderSettings}[page]||renderDashboard)();
}

function renderDashboard(){
 const total=appointments.length, pending=appointments.filter(a=>a.status==="Pending").length, approved=appointments.filter(a=>a.status==="Approved").length, today=new Date().toISOString().slice(0,10);
 const todayCount=appointments.filter(a=>a.date===today).length;
 document.getElementById("content").innerHTML=`
 <div class="page-head"><div><h1>Good afternoon, Reception 👋</h1><p>Here is what's happening across your office today.</p></div><button class="btn btn-primary" onclick="showPage('new')">＋ New Appointment</button></div>
 <div class="stats">
  <div class="stat"><div class="stat-top"><small>Total Visits</small><div class="stat-icon">♙</div></div><strong>${total}</strong><small>All recorded requests</small></div>
  <div class="stat"><div class="stat-top"><small>Pending</small><div class="stat-icon">◷</div></div><strong>${pending}</strong><small>Awaiting review</small></div>
  <div class="stat"><div class="stat-top"><small>Approved</small><div class="stat-icon">✓</div></div><strong>${approved}</strong><small>Confirmed visits</small></div>
  <div class="stat"><div class="stat-top"><small>Today</small><div class="stat-icon">▣</div></div><strong>${todayCount}</strong><small>Visits scheduled today</small></div>
 </div>
 <div class="grid2">
  <div class="card"><div class="section-head"><h3>Recent Appointments</h3><button class="btn btn-light" onclick="showPage('appointments')">View all</button></div>
  <div class="table-wrap"><table><thead><tr><th>Visitor</th><th>Host</th><th>Date</th><th>Status</th></tr></thead><tbody>${appointments.slice(-6).reverse().map(a=>`<tr><td><strong>${esc(a.name)}</strong><br><small>${esc(a.email)}</small></td><td>${esc(a.person)}</td><td>${esc(a.date)} ${esc(a.time)}</td><td>${badge(a.status)}</td></tr>`).join("")||`<tr><td colspan="4"><div class="empty">No appointments yet.</div></td></tr>`}</tbody></table></div></div>
  <div class="card"><div class="section-head"><h3>Recent Activity</h3></div><div class="pad">${appointments.slice(-5).reverse().map(a=>`<div class="activity"><div class="activity-dot"></div><div><p><strong>${esc(a.name)}</strong> requested a visit with ${esc(a.person)}.</p><small>${esc(a.date)} at ${esc(a.time)}</small></div></div>`).join("")||`<div class="empty">No recent activity.</div>`}</div></div>
 </div>`;
}

function renderAppointments(){
 document.getElementById("content").innerHTML=`
 <div class="page-head"><div><h1>Appointments</h1><p>Review and manage visitor appointments.</p></div><button class="btn btn-primary" onclick="showPage('new')">＋ New Appointment</button></div>
 <div class="card"><div class="section-head"><h3>All Appointments</h3><input id="appointmentFilter" class="search" style="width:250px" placeholder="Search appointments..." oninput="filterAppointments()"></div><div class="table-wrap"><table id="apptTable"><thead><tr><th>Visitor</th><th>Person to Visit</th><th>Department</th><th>Date</th><th>Purpose</th><th>Status</th><th>Action</th></tr></thead><tbody>${appointments.map((a,i)=>`<tr><td><strong>${esc(a.name)}</strong><br><small>${esc(a.email)}</small></td><td>${esc(a.person)}</td><td>${esc(a.department)}</td><td>${esc(a.date)}<br>${esc(a.time)}</td><td style="max-width:280px;white-space:normal">${esc(a.purpose)}</td><td>${badge(a.status)}</td><td><button class="btn btn-light" onclick="changeStatus(${i})">Update</button></td></tr>`).join("")||`<tr><td colspan="7"><div class="empty">No appointments found.</div></td></tr>`}</tbody></table></div></div>`;
}
function filterAppointments(){const q=document.getElementById("appointmentFilter").value.toLowerCase();document.querySelectorAll("#apptTable tbody tr").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?"":"none")}
function changeStatus(i){const next=prompt("Enter status: Pending, Approved, Rejected, Checked In",appointments[i].status);if(["Pending","Approved","Rejected","Checked In"].includes(next)){appointments[i].status=next;save();notify("Appointment updated");renderAppointments()}}

function renderVisitors(){
 const unique=[...new Map(appointments.map(a=>[a.email,a])).values()];
 document.getElementById("content").innerHTML=`<div class="page-head"><div><h1>Visitors</h1><p>Visitor information from submitted appointments.</p></div></div><div class="card"><div class="section-head"><h3>Visitor Directory</h3><input id="visitorFilter" class="search" style="width:250px" placeholder="Search visitors..." oninput="filterVisitors()"></div><div class="table-wrap"><table id="visitorTable"><thead><tr><th>Visitor</th><th>Email</th><th>Phone</th><th>Last Host</th><th>Department</th></tr></thead><tbody>${unique.map(a=>`<tr><td><strong>${esc(a.name)}</strong></td><td>${esc(a.email)}</td><td>${esc(a.phone||"—")}</td><td>${esc(a.person)}</td><td>${esc(a.department)}</td></tr>`).join("")||`<tr><td colspan="5"><div class="empty">No visitors yet.</div></td></tr>`}</tbody></table></div></div>`;
}
function filterVisitors(){const q=document.getElementById("visitorFilter").value.toLowerCase();document.querySelectorAll("#visitorTable tbody tr").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?"":"none")}

function renderNew(){
 document.getElementById("content").innerHTML=`<div class="page-head"><div><h1>New Appointment</h1><p>Create a visitor appointment from reception.</p></div></div><div class="card pad"><form id="newForm"><div class="form-grid">
 <div class="field"><label>Visitor Full Name</label><input id="nName" required></div><div class="field"><label>Email</label><input id="nEmail" type="email" required></div>
 <div class="field"><label>Mobile Number</label><input id="nPhone" placeholder="+34 600 000 000"></div><div class="field"><label>Person to Visit</label><select id="nPerson" required></select></div>
 <div class="field"><label>Department</label><select id="nDept"><option>Finance</option><option>Human Resources</option><option>IT</option><option>Management</option><option>Sales</option><option>Operations</option></select></div>
 <div class="field"><label>Date</label><input id="nDate" type="date" required></div><div class="field"><label>Time</label><input id="nTime" type="time" required></div>
 <div class="field full"><label>Detailed Purpose</label><textarea id="nPurpose" rows="6" required placeholder="Describe the reason for the meeting..."></textarea></div>
 </div><div class="form-actions"><button class="btn btn-light" type="button" onclick="showPage('dashboard')">Cancel</button><button class="btn btn-primary" type="submit">Create Appointment</button></div></form></div>`;
 populatePeople("nPerson");
 document.getElementById("newForm").addEventListener("submit",e=>{e.preventDefault();addAppointment("n")});
}
function populatePeople(id){document.getElementById(id).innerHTML=employees.map(e=>`<option value="${esc(e.name)}">${esc(e.name)} — ${esc(e.dept)}</option>`).join("")}
function addAppointment(prefix){
 const a={id:Date.now(),name:document.getElementById(prefix+"Name").value,email:document.getElementById(prefix+"Email").value,phone:document.getElementById(prefix+"Phone").value,person:document.getElementById(prefix+"Person").value,department:document.getElementById(prefix+"Dept").value,date:document.getElementById(prefix+"Date").value,time:document.getElementById(prefix+"Time").value,purpose:document.getElementById(prefix+"Purpose").value,status:"Pending",createdAt:new Date().toISOString()};
 appointments.push(a);save();notify("Appointment submitted successfully");showPage("appointments");
}

function renderEmployees(){
 document.getElementById("content").innerHTML=`<div class="page-head"><div><h1>Employees</h1><p>People available across your office departments.</p></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Department</th><th>Email</th></tr></thead><tbody>${employees.map(e=>`<tr><td><div style="display:flex;align-items:center;gap:10px"><div class="avatar">${initials(e.name)}</div><strong>${esc(e.name)}</strong></div></td><td>${esc(e.role)}</td><td>${esc(e.dept)}</td><td>${esc(e.email)}</td></tr>`).join("")}</tbody></table></div></div>`;
}

function renderChat(){
 document.getElementById("content").innerHTML=`<div class="page-head"><div><h1>Staff Chat</h1><p>Internal communication for reception and staff.</p></div></div><div class="card chat-layout"><div class="chat-users"><div class="section-head"><h3>Chats</h3></div><div class="user active" onclick="selectChat('All Staff',this)"><div class="avatar">AS</div><div><strong>All Staff</strong><br><small>Company group</small></div></div>${employees.map(e=>`<div class="user" onclick="selectChat('${esc(e.name)}',this)"><div class="avatar">${initials(e.name)}</div><div><strong>${esc(e.name)}</strong><br><small>${esc(e.dept)}</small></div></div>`).join("")}</div><div class="chat-main"><div class="chat-head"><div class="avatar">${initials(currentChat)}</div><div><strong>${esc(currentChat)}</strong><br><small>Staff communication</small></div></div><div id="messages" class="chat-messages"></div><form id="chatForm" class="chat-form"><input id="chatInput" placeholder="Write a message..." autocomplete="off"><button class="btn btn-primary">Send</button></form></div></div>`;
 renderMessages();
 document.getElementById("chatForm").addEventListener("submit",e=>{e.preventDefault();const input=document.getElementById("chatInput");const text=input.value.trim();if(!text)return;messages.push({chat:currentChat,sender:"Reception Admin",text,at:new Date().toISOString()});save();input.value="";renderMessages()});
}
function selectChat(name,el){currentChat=name;document.querySelectorAll(".user").forEach(x=>x.classList.remove("active"));el.classList.add("active");renderChat()}
function renderMessages(){const box=document.getElementById("messages");if(!box)return;const list=messages.filter(m=>m.chat===currentChat);box.innerHTML=list.map(m=>`<div class="msg ${m.sender==="Reception Admin"?"me":""}"><div class="bubble">${esc(m.text)}</div><small>${esc(m.sender)} · ${new Date(m.at).toLocaleString()}</small></div>`).join("")||`<div class="empty">No messages yet. Start the conversation.</div>`;box.scrollTop=box.scrollHeight}

function renderReports(){
 const total=appointments.length,approved=appointments.filter(a=>a.status==="Approved").length,pending=appointments.filter(a=>a.status==="Pending").length;
 document.getElementById("content").innerHTML=`<div class="page-head"><div><h1>Reports</h1><p>Quick overview of visitor activity.</p></div></div><div class="stats"><div class="stat"><small>Total Requests</small><strong>${total}</strong></div><div class="stat"><small>Approved</small><strong>${approved}</strong></div><div class="stat"><small>Pending</small><strong>${pending}</strong></div><div class="stat"><small>Departments</small><strong>${new Set(appointments.map(a=>a.department)).size}</strong></div></div><div class="card pad"><h3>Department Activity</h3>${["Finance","Human Resources","IT","Management","Sales","Operations"].map(d=>{let n=appointments.filter(a=>a.department===d).length;return `<div style="margin:18px 0"><div style="display:flex;justify-content:space-between"><span>${d}</span><strong>${n}</strong></div><div style="height:8px;background:#eef0f2;border-radius:8px;margin-top:7px"><div style="height:100%;width:${total?Math.min(100,n/total*100):0}%;background:#1a73e8;border-radius:8px"></div></div></div>`}).join("")}</div>`;
}
function renderSettings(){
 document.getElementById("content").innerHTML=`<div class="page-head"><div><h1>Settings</h1><p>Manage basic OfficeFlow reception settings.</p></div></div><div class="card pad"><div class="form-grid"><div class="field"><label>Company Name</label><input value="OfficeFlow"></div><div class="field"><label>Reception Email</label><input value="reception@office.com"></div><div class="field"><label>Office Phone</label><input value="+34 900 000 000"></div><div class="field"><label>Timezone</label><select><option>Europe/Madrid</option></select></div><div class="field full"><label>Visitor Instructions</label><textarea rows="5">Please arrive a few minutes before your appointment and check in with Reception.</textarea></div></div><div class="form-actions"><button class="btn btn-primary" onclick="notify('Settings saved')">Save Changes</button></div></div>`;
}

document.getElementById("visitorForm").addEventListener("submit",e=>{
 e.preventDefault();
 const a={id:Date.now(),name:vName.value,email:vEmail.value,phone:vPhone.value,person:vPerson.value,department:vDept.value,date:vDate.value,time:vTime.value,purpose:vPurpose.value,status:"Pending",createdAt:new Date().toISOString()};
 appointments.push(a);save();e.target.reset();notify("Request submitted to Reception");
});
populatePeople("vPerson");
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open")}
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){showPage("appointments");setTimeout(()=>{document.getElementById("appointmentFilter").value=e.target.value;filterAppointments()},50)}});

// Demo mode: use this switch to show the visitor portal.
// Change false to true if you want the public visitor form as the first screen.
const START_WITH_VISITOR_PORTAL=false;
if(START_WITH_VISITOR_PORTAL){document.getElementById("app").style.display="none";document.getElementById("portal").style.display="block"}else{showPage("dashboard")}
</script>
</body>
</html>
