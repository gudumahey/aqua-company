<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfficeFlow — Visitor Management</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#718096;
  --primary:#635bff;
  --primary2:#4f46e5;
  --border:#e8ebf2;
  --green:#16a34a;
  --yellow:#d97706;
  --red:#dc2626;
  --blue:#2563eb;
  --purple:#7c3aed;
  --shadow:0 12px 35px rgba(30,40,70,.08);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{font:inherit}

button{cursor:pointer;border:0}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:#111827;
  color:white;
  padding:24px 15px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:20;
}

.logo{
  font-size:22px;
  font-weight:800;
  padding:8px 12px 28px;
}

.logo span{color:#8b7cff}

.menu-title{
  color:#68748a;
  font-size:11px;
  text-transform:uppercase;
  padding:12px;
  letter-spacing:1px;
}

.nav-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  margin:4px 0;
  border-radius:10px;
  background:transparent;
  color:#b9c2d0;
  text-align:left;
  transition:.2s;
}

.nav-btn:hover{
  background:#1d2638;
  color:white;
}

.nav-btn.active{
  background:linear-gradient(135deg,#635bff,#5147d9);
  color:white;
  box-shadow:0 8px 20px rgba(99,91,255,.25);
}

.nav-icon{
  width:22px;
  text-align:center;
}

.main{
  margin-left:250px;
  width:calc(100% - 250px);
}

.topbar{
  height:76px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:10;
}

.page-title{
  font-size:22px;
  font-weight:800;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:12px;
}

.search{
  width:230px;
  border:1px solid var(--border);
  background:#f8f9fc;
  padding:10px 14px;
  border-radius:10px;
  outline:none;
}

.content{
  padding:30px;
}

/* CARDS */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:25px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px;
  box-shadow:var(--shadow);
}

.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.stat-icon{
  width:44px;
  height:44px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eeecff;
  font-size:20px;
}

.stat h3{
  font-size:29px;
  margin-top:12px;
}

.stat p{
  color:var(--muted);
  font-size:13px;
}

/* PANELS */
.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  margin-bottom:22px;
  overflow:hidden;
}

.panel-head{
  padding:20px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
}

.panel-title{
  font-size:17px;
  font-weight:800;
}

.panel-body{
  padding:22px;
}

/* BUTTONS */
.btn{
  padding:10px 15px;
  border-radius:9px;
  font-weight:700;
  transition:.2s;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-primary:hover{background:var(--primary2)}

.btn-light{
  background:#f1f3f8;
  color:#343b4d;
}

.btn-success{
  background:#dcfce7;
  color:#15803d;
}

.btn-danger{
  background:#fee2e2;
  color:#b91c1c;
}

.btn-blue{
  background:#dbeafe;
  color:#1d4ed8;
}

.btn-purple{
  background:#ede9fe;
  color:#6d28d9;
}

.btn-sm{
  padding:7px 10px;
  font-size:12px;
}

/* TABLE */
.table-wrap{overflow-x:auto}

table{
  width:100%;
  border-collapse:collapse;
  min-width:750px;
}

th,td{
  padding:14px 16px;
  text-align:left;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

th{
  color:#667085;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

td strong{font-weight:700}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

/* BADGES */
.badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
}

.pending{background:#fef3c7;color:#a16207}
.approved{background:#dbeafe;color:#1d4ed8}
.rejected{background:#fee2e2;color:#b91c1c}
.registered{background:#ede9fe;color:#6d28d9}
.checked-in{background:#dcfce7;color:#15803d}
.checked-out{background:#e5e7eb;color:#4b5563}

/* FORMS */
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:17px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.form-group.full{grid-column:1/-1}

label{
  font-size:12px;
  font-weight:700;
  color:#4b5563;
}

input,select,textarea{
  width:100%;
  border:1px solid #dfe3eb;
  background:#fbfcfe;
  border-radius:9px;
  padding:11px 12px;
  outline:none;
  color:var(--text);
}

input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(99,91,255,.08);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.form-actions{
  margin-top:20px;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

/* APPOINTMENT FLOW */
.flow{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:8px;
}

.flow-step{
  padding:5px 8px;
  border-radius:6px;
  background:#eef0f5;
  color:#8a93a5;
  font-size:10px;
  font-weight:700;
}

.flow-step.done{
  background:#dcfce7;
  color:#15803d;
}

.flow-arrow{
  color:#9ca3af;
  font-size:10px;
}

/* WELCOME */
.hero{
  background:
    radial-gradient(circle at top right,rgba(99,91,255,.25),transparent 35%),
    linear-gradient(135deg,#111827,#202a44);
  color:white;
  border-radius:18px;
  padding:30px;
  margin-bottom:25px;
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  color:#cbd5e1;
}

/* EMPTY */
.empty{
  padding:45px;
  text-align:center;
  color:#8b95a7;
}

/* MODAL */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal-bg.show{display:flex}

.modal{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:18px;
  box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.modal-head{
  padding:20px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h2{font-size:19px}

.close{
  width:34px;
  height:34px;
  border-radius:9px;
  background:#f1f3f7;
  font-size:18px;
}

.modal-body{padding:22px}

/* TOAST */
.toast{
  position:fixed;
  right:25px;
  bottom:25px;
  background:#111827;
  color:white;
  padding:13px 18px;
  border-radius:10px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
  z-index:200;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* MOBILE */
.mobile-menu{
  display:none;
  background:#111827;
  color:white;
  border-radius:8px;
  padding:9px 12px;
}

@media(max-width:1000px){
  .stats{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:750px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{display:block}

  .topbar{padding:0 15px}

  .search{display:none}

  .content{padding:18px}

  .stats{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .hero h1{font-size:24px}
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

  <div class="logo">
    Office<span>Flow</span>
  </div>

  <div class="menu-title">Main</div>

  <button class="nav-btn active" onclick="showPage('dashboard',this)">
    <span class="nav-icon">▦</span> Dashboard
  </button>

  <button class="nav-btn" onclick="showPage('appointments',this)">
    <span class="nav-icon">📅</span> Appointments
  </button>

  <button class="nav-btn" onclick="showPage('visitors',this)">
    <span class="nav-icon">👤</span> Visitors
  </button>

  <button class="nav-btn" onclick="showPage('employees',this)">
    <span class="nav-icon">👥</span> Employees
  </button>

  <div class="menu-title">Office</div>

  <button class="nav-btn" onclick="showPage('newAppointment',this)">
    <span class="nav-icon">＋</span> New Appointment
  </button>

  <button class="nav-btn" onclick="showPage('tasks',this)">
    <span class="nav-icon">✓</span> Tasks
  </button>

  <button class="nav-btn" onclick="showPage('notes',this)">
    <span class="nav-icon">📝</span> Notes & Reports
  </button>

  <button class="nav-btn" onclick="showPage('announcements',this)">
    <span class="nav-icon">📢</span> Announcements
  </button>

  <button class="nav-btn" onclick="showPage('settings',this)">
    <span class="nav-icon">⚙</span> Settings
  </button>

</aside>

<!-- MAIN -->
<main class="main">

<header class="topbar">
  <div style="display:flex;align-items:center;gap:12px">
    <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
    <div class="page-title" id="pageTitle">Dashboard</div>
  </div>

  <div class="top-actions">
    <input class="search" id="globalSearch"
           placeholder="Search..."
           oninput="globalSearch(this.value)">
  </div>
</header>

<section class="content" id="content"></section>

</main>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Details</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

/* =========================
   STORAGE
========================= */

const STORAGE = {
  appointments:"office_appointments_v2",
  visitors:"office_visitors_v2",
  employees:"office_employees_v2",
  tasks:"office_tasks_v2",
  notes:"office_notes_v2",
  announcements:"office_announcements_v2"
};

function getData(key){
  try{
    return JSON.parse(localStorage.getItem(key)) || [];
  }catch{
    return [];
  }
}

function saveData(key,data){
  localStorage.setItem(key,JSON.stringify(data));
}

let appointments = getData(STORAGE.appointments);
let visitors = getData(STORAGE.visitors);
let employees = getData(STORAGE.employees);
let tasks = getData(STORAGE.tasks);
let notes = getData(STORAGE.notes);
let announcements = getData(STORAGE.announcements);

/* =========================
   SEED DATA
========================= */

if(!employees.length){
  employees=[
    {
      id:"EMP-001",
      name:"Alex Johnson",
      position:"Office Manager",
      department:"Management",
      email:"alex@office.com",
      status:"Active"
    },
    {
      id:"EMP-002",
      name:"Maria Garcia",
      position:"HR Manager",
      department:"Human Resources",
      email:"maria@office.com",
      status:"Active"
    },
    {
      id:"EMP-003",
      name:"Daniel Smith",
      position:"IT Specialist",
      department:"IT",
      email:"daniel@office.com",
      status:"Active"
    }
  ];

  saveData(STORAGE.employees,employees);
}

if(!tasks.length){
  tasks=[
    {id:1,name:"Review visitor records",done:false},
    {id:2,name:"Prepare Monday meeting",done:false},
    {id:3,name:"Check office documents",done:true}
  ];

  saveData(STORAGE.tasks,tasks);
}

/* =========================
   HELPERS
========================= */

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function today(){
  return new Date().toISOString().split("T")[0];
}

function dateText(date){
  if(!date)return "-";

  const d=new Date(date+"T00:00:00");

  return d.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}

function statusBadge(status){
  const cls=status.toLowerCase().replaceAll(" ","-");

  return `<span class="badge ${cls}">
    ${escapeHTML(status)}
  </span>`;
}

function toast(message){
  const el=document.getElementById("toast");

  el.textContent=message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2500);
}

function generateID(prefix,collection){
  const year=new Date().getFullYear();
  const number=String(collection.length+1).padStart(5,"0");

  return `${prefix}-${year}-${number}`;
}

/* =========================
   NAVIGATION
========================= */

const titles={
  dashboard:"Dashboard",
  appointments:"Appointments",
  visitors:"Visitors",
  employees:"Employees",
  newAppointment:"New Appointment",
  tasks:"Tasks",
  notes:"Notes & Reports",
  announcements:"Announcements",
  settings:"Settings"
};

function showPage(page,button){

  document.getElementById("pageTitle").textContent=titles[page] || "OfficeFlow";

  document.querySelectorAll(".nav-btn").forEach(b=>{
    b.classList.remove("active");
  });

  if(button)button.classList.add("active");

  document.getElementById("sidebar").classList.remove("open");

  if(page==="dashboard")renderDashboard();
  if(page==="appointments")renderAppointments();
  if(page==="visitors")renderVisitors();
  if(page==="employees")renderEmployees();
  if(page==="newAppointment")renderNewAppointment();
  if(page==="tasks")renderTasks();
  if(page==="notes")renderNotes();
  if(page==="announcements")renderAnnouncements();
  if(page==="settings")renderSettings();
}

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

/* =========================
   DASHBOARD
========================= */

function renderDashboard(){

  const pending=appointments.filter(a=>a.status==="Pending").length;
  const approved=appointments.filter(a=>a.status==="Approved").length;
  const registered=visitors.length;

  const todayCheckins=visitors.filter(v=>
    v.date===today() &&
    (v.status==="Checked In" || v.status==="Checked Out")
  ).length;

  document.getElementById("content").innerHTML=`

    <div class="hero">
      <h1>Welcome to OfficeFlow 👋</h1>
      <p>Manage appointments, visitors and office activity from one place.</p>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-top">
          <p>Pending Appointments</p>
          <div class="stat-icon">⏳</div>
        </div>
        <h3>${pending}</h3>
        <p>Waiting for approval</p>
      </div>

      <div class="stat">
        <div class="stat-top">
          <p>Approved Appointments</p>
          <div class="stat-icon">✓</div>
        </div>
        <h3>${approved}</h3>
        <p>Ready for registration</p>
      </div>

      <div class="stat">
        <div class="stat-top">
          <p>Registered Visitors</p>
          <div class="stat-icon">👤</div>
        </div>
        <h3>${registered}</h3>
        <p>Total visitor records</p>
      </div>

      <div class="stat">
        <div class="stat-top">
          <p>Today's Visits</p>
          <div class="stat-icon">📅</div>
        </div>
        <h3>${todayCheckins}</h3>
        <p>Checked in / out today</p>
      </div>

    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Recent Appointment Requests</div>
        <button class="btn btn-primary btn-sm"
          onclick="showPage('appointments')">
          View All
        </button>
      </div>

      <div class="table-wrap">
        ${appointmentTable(
          appointments
          .slice()
          .reverse()
          .slice(0,5)
        )}
      </div>
    </div>

  `;
}

/* =========================
   APPOINTMENTS
========================= */

function renderAppointments(){

  document.getElementById("content").innerHTML=`

    <div class="panel">

      <div class="panel-head">

        <div>
          <div class="panel-title">Appointment Management</div>
          <div style="font-size:12px;color:#8a93a5;margin-top:5px">
            Approve an appointment before registering the visitor.
          </div>
        </div>

        <button class="btn btn-primary"
          onclick="showPage('newAppointment')">
          + New Appointment
        </button>

      </div>

      <div class="panel-body">

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">

          <button class="btn btn-light btn-sm"
            onclick="filterAppointments('All')">All</button>

          <button class="btn btn-light btn-sm"
            onclick="filterAppointments('Pending')">Pending</button>

          <button class="btn btn-light btn-sm"
            onclick="filterAppointments('Approved')">Approved</button>

          <button class="btn btn-light btn-sm"
            onclick="filterAppointments('Rejected')">Rejected</button>

          <button class="btn btn-light btn-sm"
            onclick="filterAppointments('Registered')">Registered</button>

        </div>

        <div id="appointmentList">
          ${appointmentTable(appointments)}
        </div>

      </div>

    </div>

  `;
}

function appointmentTable(list){

  if(!list.length){
    return `<div class="empty">
      <div style="font-size:35px">📅</div>
      <p>No appointments found.</p>
    </div>`;
  }

  return `
  <table>

    <thead>
      <tr>
        <th>Appointment</th>
        <th>Visitor</th>
        <th>Date & Time</th>
        <th>Host</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>

    ${list.map(a=>`

      <tr>

        <td>
          <strong>${escapeHTML(a.appointmentId)}</strong>
          <br>
          <small style="color:#8a93a5">
            ${escapeHTML(a.reason)}
          </small>
        </td>

        <td>
          <strong>${escapeHTML(a.name)}</strong>
          <br>
          <small>${escapeHTML(a.phone)}</small>
        </td>

        <td>
          ${dateText(a.date)}
          <br>
          <small>${escapeHTML(a.time)}</small>
        </td>

        <td>${escapeHTML(a.host)}</td>

        <td>${statusBadge(a.status)}</td>

        <td>

          <div class="actions">

            <button class="btn btn-light btn-sm"
              onclick="viewAppointment('${a.appointmentId}')">
              View
            </button>

            ${a.status==="Pending" ? `

              <button class="btn btn-success btn-sm"
                onclick="approveAppointment('${a.appointmentId}')">
                Approve
              </button>

              <button class="btn btn-danger btn-sm"
                onclick="rejectAppointment('${a.appointmentId}')">
                Reject
              </button>

            `:""}

            ${a.status==="Approved" ? `

              <button class="btn btn-purple btn-sm"
                onclick="registerAppointment('${a.appointmentId}')">
                Complete Registration
              </button>

            `:""}

          </div>

        </td>

      </tr>

    `).join("")}

    </tbody>
  </table>
  `;
}

function filterAppointments(status){

  const list=status==="All"
    ? appointments
    : appointments.filter(a=>a.status===status);

  document.getElementById("appointmentList").innerHTML=
    appointmentTable(list);
}

/* =========================
   NEW APPOINTMENT
========================= */

function renderNewAppointment(prefill=null){

  const a=prefill || {};

  document.getElementById("content").innerHTML=`

    <div class="panel">

      <div class="panel-head">
        <div>
          <div class="panel-title">
            ${prefill ? "Complete Visitor Registration" : "New Appointment Request"}
          </div>

          <div style="font-size:12px;color:#8a93a5;margin-top:5px">
            ${prefill
              ? "Review the approved appointment and complete registration."
              : "Create a new appointment request."
            }
          </div>
        </div>
      </div>

      <div class="panel-body">

        <form onsubmit="${prefill
          ? `completeRegistration(event,'${prefill.appointmentId}')`
          : `createAppointment(event)`
        }">

          <div class="form-grid">

            <div class="form-group">
              <label>Full Name *</label>
              <input id="f_name" required value="${escapeHTML(a.name)}">
            </div>

            <div class="form-group">
              <label>Age *</label>
              <input id="f_age" type="number" min="1" max="120"
                required value="${escapeHTML(a.age)}">
            </div>

            <div class="form-group">
              <label>Phone Number *</label>
              <input id="f_phone" required value="${escapeHTML(a.phone)}">
            </div>

            <div class="form-group">
              <label>Email</label>
              <input id="f_email" type="email"
                value="${escapeHTML(a.email)}">
            </div>

            <div class="form-group">
              <label>Occupation</label>
              <input id="f_job" value="${escapeHTML(a.job)}">
            </div>

            <div class="form-group">
              <label>Company / Organization</label>
              <input id="f_company" value="${escapeHTML(a.company)}">
            </div>

            <div class="form-group">
              <label>Person to Visit *</label>
              <select id="f_host" required>

                <option value="">Select employee</option>

                ${employees.map(e=>`
                  <option
                    value="${escapeHTML(e.name)}"
                    ${a.host===e.name ? "selected":""}>
                    ${escapeHTML(e.name)} — ${escapeHTML(e.department)}
                  </option>
                `).join("")}

              </select>
            </div>

            <div class="form-group">
              <label>Department</label>
              <input id="f_department"
                value="${escapeHTML(a.department)}">
            </div>

            <div class="form-group">
              <label>Appointment Date *</label>
              <input id="f_date" type="date"
                required value="${escapeHTML(a.date)}">
            </div>

            <div class="form-group">
              <label>Appointment Time *</label>
              <input id="f_time" type="time"
                required value="${escapeHTML(a.time)}">
            </div>

            <div class="form-group full">
              <label>Reason for Visit *</label>
              <input id="f_reason" required
                value="${escapeHTML(a.reason)}">
            </div>

            <div class="form-group full">
              <label>Additional Message / Notes</label>
              <textarea id="f_notes">${escapeHTML(a.notes)}</textarea>
            </div>

            ${prefill ? `

            <div class="form-group">
              <label>ID Document Type</label>
              <select id="f_idtype">
                <option value="">Select</option>
                <option>DNI</option>
                <option>NIE</option>
                <option>Passport</option>
                <option>Other</option>
              </select>
            </div>

            <div class="form-group">
              <label>ID Document Number</label>
              <input id="f_idnumber">
            </div>

            `:""}

          </div>

          <div class="form-actions">

            <button type="button"
              class="btn btn-light"
              onclick="showPage('appointments')">
              Cancel
            </button>

            <button class="btn btn-primary">
              ${prefill
                ? "Complete Registration"
                : "Submit Appointment"
              }
            </button>

          </div>

        </form>

      </div>

    </div>

  `;
}

function createAppointment(e){

  e.preventDefault();

  const appointment={
    appointmentId:generateID("APT",appointments),

    name:document.getElementById("f_name").value.trim(),
    age:document.getElementById("f_age").value,
    phone:document.getElementById("f_phone").value.trim(),
    email:document.getElementById("f_email").value.trim(),

    job:document.getElementById("f_job").value.trim(),
    company:document.getElementById("f_company").value.trim(),

    host:document.getElementById("f_host").value,
    department:document.getElementById("f_department").value.trim(),

    date:document.getElementById("f_date").value,
    time:document.getElementById("f_time").value,

    reason:document.getElementById("f_reason").value.trim(),
    notes:document.getElementById("f_notes").value.trim(),

    status:"Pending",
    createdAt:new Date().toISOString()
  };

  appointments.push(appointment);

  saveData(STORAGE.appointments,appointments);

  toast("Appointment request created!");

  showPage("appointments");
}

/* =========================
   APPROVE / REJECT
========================= */

function approveAppointment(id){

  const a=appointments.find(x=>x.appointmentId===id);

  if(!a)return;

  a.status="Approved";
  a.approvedAt=new Date().toISOString();

  saveData(STORAGE.appointments,appointments);

  toast("Appointment approved ✓");

  renderAppointments();
}

function rejectAppointment(id){

  const a=appointments.find(x=>x.appointmentId===id);

  if(!a)return;

  a.status="Rejected";
  a.rejectedAt=new Date().toISOString();

  saveData(STORAGE.appointments,appointments);

  toast("Appointment rejected");

  renderAppointments();
}

/* =========================
   VIEW APPOINTMENT
========================= */

function viewAppointment(id){

  const a=appointments.find(x=>x.appointmentId===id);

  if(!a)return;

  document.getElementById("modalTitle").textContent=
    "Appointment "+a.appointmentId;

  document.getElementById("modalBody").innerHTML=`

    <div style="display:grid;gap:14px">

      <div>
        <small style="color:#8a93a5">Visitor</small>
        <h3>${escapeHTML(a.name)}</h3>
      </div>

      <div class="flow">

        <span class="flow-step done">REQUESTED</span>
        <span class="flow-arrow">→</span>

        <span class="flow-step ${["Approved","Registered"].includes(a.status)?"done":""}">
          APPROVED
        </span>

        <span class="flow-arrow">→</span>

        <span class="flow-step ${a.status==="Registered"?"done":""}">
          REGISTERED
        </span>

      </div>

      <hr style="border:0;border-top:1px solid #eee">

      <p><b>Age:</b> ${escapeHTML(a.age)}</p>
      <p><b>Phone:</b> ${escapeHTML(a.phone)}</p>
      <p><b>Email:</b> ${escapeHTML(a.email || "-")}</p>
      <p><b>Occupation:</b> ${escapeHTML(a.job || "-")}</p>
      <p><b>Company:</b> ${escapeHTML(a.company || "-")}</p>
      <p><b>Person to Visit:</b> ${escapeHTML(a.host)}</p>
      <p><b>Department:</b> ${escapeHTML(a.department || "-")}</p>
      <p><b>Date:</b> ${dateText(a.date)}</p>
      <p><b>Time:</b> ${escapeHTML(a.time)}</p>
      <p><b>Reason:</b> ${escapeHTML(a.reason)}</p>
      <p><b>Message:</b> ${escapeHTML(a.notes || "-")}</p>

      <div>
        ${statusBadge(a.status)}
      </div>

    </div>

  `;

  document.getElementById("modalBg").classList.add("show");
}

/* =========================
   REGISTRATION
========================= */

function registerAppointment(id){

  const a=appointments.find(x=>x.appointmentId===id);

  if(!a || a.status!=="Approved")return;

  renderNewAppointment(a);
}

function completeRegistration(e,id){

  e.preventDefault();

  const a=appointments.find(x=>x.appointmentId===id);

  if(!a)return;

  const visitor={
    visitorId:generateID("VIS",visitors),

    appointmentId:a.appointmentId,

    name:document.getElementById("f_name").value.trim(),
    age:document.getElementById("f_age").value,

    phone:document.getElementById("f_phone").value.trim(),
    email:document.getElementById("f_email").value.trim(),

    job:document.getElementById("f_job").value.trim(),
    company:document.getElementById("f_company").value.trim(),

    host:document.getElementById("f_host").value,
    department:document.getElementById("f_department").value.trim(),

    date:document.getElementById("f_date").value,
    time:document.getElementById("f_time").value,

    reason:document.getElementById("f_reason").value.trim(),
    notes:document.getElementById("f_notes").value.trim(),

    idType:document.getElementById("f_idtype").value,
    idNumber:document.getElementById("f_idnumber").value.trim(),

    status:"Registered",

    registeredAt:new Date().toISOString()
  };

  visitors.push(visitor);

  a.status="Registered";
  a.registeredAt=new Date().toISOString();

  saveData(STORAGE.visitors,visitors);
  saveData(STORAGE.appointments,appointments);

  toast("Visitor registration completed ✓");

  showPage("visitors");
}

/* =========================
   VISITORS
========================= */

function renderVisitors(){

  document.getElementById("content").innerHTML=`

    <div class="panel">

      <div class="panel-head">

        <div>
          <div class="panel-title">Registered Visitors</div>
          <div style="font-size:12px;color:#8a93a5;margin-top:5px">
            Only approved and registered visitors appear here.
          </div>
        </div>

      </div>

      <div class="table-wrap">

        ${visitorTable(visitors)}

      </div>

    </div>

  `;
}

function visitorTable(list){

  if(!list.length){
    return `<div class="empty">
      <div style="font-size:35px">👤</div>
      <p>No registered visitors yet.</p>
    </div>`;
  }

  return `
  <table>

    <thead>
      <tr>
        <th>Visitor</th>
        <th>Appointment</th>
        <th>Visit</th>
        <th>Host</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>

    ${list.map(v=>`

      <tr>

        <td>
          <strong>${escapeHTML(v.name)}</strong>
          <br>
          <small>${escapeHTML(v.phone)}</small>
        </td>

        <td>
          <strong>${escapeHTML(v.visitorId)}</strong>
          <br>
          <small>${escapeHTML(v.appointmentId)}</small>
        </td>

        <td>
          ${dateText(v.date)}
          <br>
          <small>${escapeHTML(v.time)}</small>
        </td>

        <td>${escapeHTML(v.host)}</td>

        <td>${statusBadge(v.status)}</td>

        <td>

          <div class="actions">

            ${v.status==="Registered" ? `
              <button class="btn btn-success btn-sm"
                onclick="checkIn('${v.visitorId}')">
                Check In
              </button>
            `:""}

            ${v.status==="Checked In" ? `
              <button class="btn btn-danger btn-sm"
                onclick="checkOut('${v.visitorId}')">
                Check Out
              </button>
            `:""}

            <button class="btn btn-light btn-sm"
              onclick="viewVisitor('${v.visitorId}')">
              View
            </button>

          </div>

        </td>

      </tr>

    `).join("")}

    </tbody>
  </table>
  `;
}

/* =========================
   CHECK IN / OUT
========================= */

function checkIn(id){

  const v=visitors.find(x=>x.visitorId===id);

  if(!v)return;

  v.status="Checked In";
  v.checkedInAt=new Date().toISOString();

  saveData(STORAGE.visitors,visitors);

  toast(`${v.name} checked in ✓`);

  renderVisitors();
}

function checkOut(id){

  const v=visitors.find(x=>x.visitorId===id);

  if(!v)return;

  v.status="Checked Out";
  v.checkedOutAt=new Date().toISOString();

  saveData(STORAGE.visitors,visitors);

  toast(`${v.name} checked out`);

  renderVisitors();
}

function viewVisitor(id){

  const v=visitors.find(x=>x.visitorId===id);

  if(!v)return;

  document.getElementById("modalTitle").textContent=
    "Visitor "+v.visitorId;

  document.getElementById("modalBody").innerHTML=`

    <div style="display:grid;gap:13px">

      <h2>${escapeHTML(v.name)}</h2>

      <div class="flow">

        <span class="flow-step done">REQUESTED</span>
        <span class="flow-arrow">→</span>

        <span class="flow-step done">APPROVED</span>
        <span class="flow-arrow">→</span>

        <span class="flow-step done">REGISTERED</span>
        <span class="flow-arrow">→</span>

        <span class="flow-step ${
          ["Checked In","Checked Out"].includes(v.status)?"done":""
        }">CHECK IN</span>

        <span class="flow-arrow">→</span>

        <span class="flow-step ${
          v.status==="Checked Out"?"done":""
        }">CHECK OUT</span>

      </div>

      <hr style="border:0;border-top:1px solid #eee">

      <p><b>Phone:</b> ${escapeHTML(v.phone)}</p>
      <p><b>Email:</b> ${escapeHTML(v.email || "-")}</p>
      <p><b>Occupation:</b> ${escapeHTML(v.job || "-")}</p>
      <p><b>Company:</b> ${escapeHTML(v.company || "-")}</p>
      <p><b>Host:</b> ${escapeHTML(v.host)}</p>
      <p><b>Department:</b> ${escapeHTML(v.department || "-")}</p>
      <p><b>Appointment:</b> ${dateText(v.date)} at ${escapeHTML(v.time)}</p>
      <p><b>Reason:</b> ${escapeHTML(v.reason)}</p>
      <p><b>ID:</b> ${escapeHTML(v.idType || "-")} ${escapeHTML(v.idNumber || "")}</p>

      <div>${statusBadge(v.status)}</div>

    </div>

  `;

  document.getElementById("modalBg").classList.add("show");
}

/* =========================
   EMPLOYEES
========================= */

function renderEmployees(){

  document.getElementById("content").innerHTML=`

    <div class="panel">

      <div class="panel-head">
        <div class="panel-title">Employees</div>

        <button class="btn btn-primary"
          onclick="addEmployee()">
          + Add Employee
        </button>
      </div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Name</th>
              <th>Position</th>
              <th>Department</th>
              <th>Email</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody>

          ${employees.map(e=>`

            <tr>
              <td><strong>${escapeHTML(e.name)}</strong></td>
              <td>${escapeHTML(e.position)}</td>
              <td>${escapeHTML(e.department)}</td>
              <td>${escapeHTML(e.email)}</td>
              <td>
                <span class="badge checked-in">
                  ${escapeHTML(e.status)}
                </span>
              </td>
            </tr>

          `).join("")}

          </tbody>

        </table>

      </div>

    </div>

  `;
}

function addEmployee(){

  document.getElementById("modalTitle").textContent="Add Employee";

  document.getElementById("modalBody").innerHTML=`

    <form onsubmit="saveEmployee(event)">

      <div class="form-grid">

        <div class="form-group">
          <label>Name</label>
          <input id="e_name" required>
        </div>

        <div class="form-group">
          <label>Position</label>
          <input id="e_position" required>
        </div>

        <div class="form-group">
          <label>Department</label>
          <input id="e_department" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input id="e_email" type="email">
        </div>

      </div>

      <div class="form-actions">
        <button class="btn btn-primary">Add Employee</button>
      </div>

    </form>

  `;

  document.getElementById("modalBg").classList.add("show");
}

function saveEmployee(e){

  e.preventDefault();

  employees.push({
    id:generateID("EMP",employees),
    name:document.getElementById("e_name").value,
    position:document.getElementById("e_position").value,
    department:document.getElementById("e_department").value,
    email:document.getElementById("e_email").value,
    status:"Active"
  });

  saveData(STORAGE.employees,employees);

  closeModal();

  toast("Employee added ✓");

  renderEmployees();
}

/* =========================
   TASKS
========================= */

function renderTasks(){

  document.getElementById("content").innerHTML=`

    <div class="panel">

      <div class="panel-head">

        <div class="panel-title">Office Tasks</div>

        <button class="btn btn-primary"
          onclick="addTask()">
          + Add Task
        </button>

      </div>

      <div class="panel-body">

        ${tasks.map(t=>`

          <div style="
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:14px 0;
            border-bottom:1px solid #eee;
          ">

            <label style="
              display:flex;
              align-items:center;
              gap:10px;
              cursor:pointer;
              text-decoration:${t.done?"line-through":"none"};
              color:${t.done?"#9ca3af":"#172033"};
            ">

              <input type="checkbox"
                ${t.done?"checked":""}
                onchange="toggleTask(${t.id})">

              ${escapeHTML(t.name)}

            </label>

          </div>

        `).join("")}

      </div>

    </div>

  `;
}

function addTask(){

  const name=prompt("Task name:");

  if(!name)return;

  tasks.push({
    id:Date.now(),
    name,
    done:false
  });

  saveData(STORAGE.tasks,tasks);

  renderTasks();
}

function toggleTask(id){

  const t=tasks.find(x=>x.id===id);

  if(!t)return;

  t.done=!t.done;

  saveData(STORAGE.tasks,tasks);

  renderTasks();
}

/* =========================
   NOTES
========================= */

function renderNotes(){

  document.getElementById("content").innerHTML=`

    <div class="panel">

      <div class="panel-head">

        <div class="panel-title">Notes & Reports</div>

        <button class="btn btn-primary"
          onclick="addNote()">
          + Add Note
        </button>

      </div>

      <div class="panel-body">

        ${notes.length ? notes.map(n=>`

          <div style="
            padding:15px;
            background:#f8f9fc;
            border-radius:10px;
            margin-bottom:10px;
          ">

            <strong>${escapeHTML(n.title)}</strong>

            <p style="
              color:#687386;
              margin-top:6px;
              font-size:13px;
            ">
              ${escapeHTML(n.text)}
            </p>

          </div>

        `).join("") : `

          <div class="empty">
            No notes yet.
          </div>

        `}

      </div>

    </div>

  `;
}

function addNote(){

  const title=prompt("Note title:");

  if(!title)return;

  const text=prompt("Write your note:");

  if(!text)return;

  notes.push({
    id:Date.now(),
    title,
    text,
    createdAt:new Date().toISOString()
  });

  saveData(STORAGE.notes,notes);

  renderNotes();
}

/* =========================
   ANNOUNCEMENTS
========================= */

function renderAnnouncements(){

  document.getElementById("content").innerHTML=`

    <div class="panel">

      <div class="panel-head">

        <div class="panel-title">Announcements</div>

        <button class="btn btn-primary"
          onclick="addAnnouncement()">
          + New Announcement
        </button>

      </div>

      <div class="panel-body">

        ${announcements.length ? announcements.map(a=>`

          <div style="
            padding:18px;
            border:1px solid #e7eaf0;
            border-radius:12px;
            margin-bottom:12px;
          ">

            <strong>${escapeHTML(a.title)}</strong>

            <p style="
              margin-top:7px;
              color:#687386;
            ">
              ${escapeHTML(a.text)}
            </p>

          </div>

        `).join("") : `

          <div class="empty">
            No announcements.
          </div>

        `}

      </div>

    </div>

  `;
}

function addAnnouncement(){

  const title=prompt("Announcement title:");

  if(!title)return;

  const text=prompt("Announcement message:");

  if(!text)return;

  announcements.push({
    id:Date.now(),
    title,
    text
  });

  saveData(STORAGE.announcements,announcements);

  renderAnnouncements();
}

/* =========================
   SETTINGS
========================= */

function renderSettings(){

  document.getElementById("content").innerHTML=`

    <div class="panel">

      <div class="panel-head">
        <div class="panel-title">Settings</div>
      </div>

      <div class="panel-body">

        <h3>OfficeFlow Settings</h3>

        <p style="
          color:#778196;
          margin-top:8px;
          line-height:1.6;
        ">
          This website stores its demo data in your browser's
          LocalStorage.
        </p>

        <hr style="
          border:0;
          border-top:1px solid #eee;
          margin:22px 0;
        ">

        <button class="btn btn-danger"
          onclick="clearAllData()">
          Reset All Data
        </button>

      </div>

    </div>

  `;
}

function clearAllData(){

  if(!confirm(
    "Are you sure? This will delete all appointments and visitor records."
  ))return;

  localStorage.removeItem(STORAGE.appointments);
  localStorage.removeItem(STORAGE.visitors);

  appointments=[];
  visitors=[];

  toast("Appointment and visitor data cleared");

  renderDashboard();
}

/* =========================
   SEARCH
========================= */

function globalSearch(value){

  value=value.toLowerCase().trim();

  if(!value){
    renderDashboard();
    return;
  }

  const matchingAppointments=appointments.filter(a=>
    JSON.stringify(a).toLowerCase().includes(value)
  );

  const matchingVisitors=visitors.filter(v=>
    JSON.stringify(v).toLowerCase().includes(value)
  );

  document.getElementById("pageTitle").textContent="Search";

  document.getElementById("content").innerHTML=`

    <div class="panel">

      <div class="panel-head">
        <div class="panel-title">
          Search Results
        </div>
      </div>

      <div class="panel-body">

        <h3 style="margin-bottom:12px">
          Appointments (${matchingAppointments.length})
        </h3>

        ${appointmentTable(matchingAppointments)}

        <h3 style="margin:25px 0 12px">
          Visitors (${matchingVisitors.length})
        </h3>

        ${visitorTable(matchingVisitors)}

      </div>

    </div>

  `;
}

/* =========================
   MODAL
========================= */

function closeModal(){
  document.getElementById("modalBg").classList.remove("show");
}

document.getElementById("modalBg").addEventListener("click",function(e){

  if(e.target===this){
    closeModal();
  }

});

/* =========================
   START
========================= */

renderDashboard();

</script>
