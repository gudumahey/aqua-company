<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfficeFlow — Visitor Management</title>

<style>
:root{
  --bg:#f5f7fb;
  --white:#fff;
  --dark:#101827;
  --dark2:#182235;
  --text:#172033;
  --muted:#748096;
  --border:#e5e8ef;
  --primary:#635bff;
  --primary2:#5148dc;
  --green:#16a34a;
  --red:#dc2626;
  --yellow:#d97706;
  --blue:#2563eb;
  --purple:#7c3aed;
  --shadow:0 12px 35px rgba(20,30,60,.07);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:255px;
  background:var(--dark);
  color:white;
  padding:24px 15px;
  z-index:50;
}

.logo{
  font-size:24px;
  font-weight:900;
  padding:8px 12px 30px;
}

.logo span{
  color:#8178ff;
}

.menu-title{
  color:#68748a;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  padding:13px 12px 7px;
}

.nav-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  margin:4px 0;
  border-radius:10px;
  background:transparent;
  color:#b9c2d0;
  text-align:left;
  transition:.2s;
}

.nav-btn:hover{
  background:#1c273a;
  color:white;
}

.nav-btn.active{
  background:linear-gradient(135deg,#635bff,#5148dc);
  color:white;
  box-shadow:0 8px 20px rgba(99,91,255,.25);
}

.icon{
  width:23px;
  text-align:center;
}

/* MAIN */

.main{
  margin-left:255px;
  min-height:100vh;
}

.topbar{
  height:76px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:20;
}

.page-title{
  font-size:22px;
  font-weight:850;
}

.top-right{
  color:var(--muted);
  font-size:13px;
}

.mobile-menu{
  display:none;
  background:var(--dark);
  color:white;
  padding:9px 11px;
  border-radius:8px;
}

.content{
  padding:30px;
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 90% 10%,rgba(99,91,255,.35),transparent 28%),
    linear-gradient(135deg,#101827,#242d49);
  color:white;
  border-radius:20px;
  padding:35px;
  margin-bottom:25px;
}

.hero h1{
  font-size:32px;
  margin-bottom:9px;
}

.hero p{
  color:#cbd5e1;
  max-width:650px;
  line-height:1.6;
}

.hero-buttons{
  display:flex;
  gap:12px;
  margin-top:25px;
  flex-wrap:wrap;
}

.hero-btn{
  padding:14px 20px;
  border-radius:11px;
  font-weight:800;
  transition:.2s;
}

.hero-btn:hover{
  transform:translateY(-2px);
}

.hero-primary{
  background:white;
  color:#4f46e5;
}

.hero-secondary{
  background:#635bff;
  color:white;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:25px;
}

.stat-card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px;
  box-shadow:var(--shadow);
}

.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.stat-icon{
  width:43px;
  height:43px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#eeecff;
  border-radius:12px;
  font-size:19px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
}

.stat-number{
  font-size:30px;
  font-weight:900;
  margin-top:12px;
}

/* PANELS */

.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  box-shadow:var(--shadow);
  overflow:hidden;
  margin-bottom:22px;
}

.panel-head{
  padding:20px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.panel-title{
  font-size:17px;
  font-weight:850;
}

.panel-subtitle{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.panel-body{
  padding:22px;
}

/* BUTTONS */

.btn{
  padding:10px 15px;
  border-radius:9px;
  font-weight:750;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-light{
  background:#f0f2f7;
  color:#343b4d;
}

.btn-green{
  background:#dcfce7;
  color:#15803d;
}

.btn-red{
  background:#fee2e2;
  color:#b91c1c;
}

.btn-blue{
  background:#dbeafe;
  color:#1d4ed8;
}

.btn-purple{
  background:#ede9fe;
  color:#6d28d9;
}

.btn-sm{
  padding:7px 10px;
  font-size:12px;
}

/* TABLE */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:850px;
  border-collapse:collapse;
}

th,td{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:13px;
}

th{
  color:#718096;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

td strong{
  font-weight:750;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

/* BADGES */

.badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:850;
}

.badge-pending{
  background:#fef3c7;
  color:#a16207;
}

.badge-approved{
  background:#dbeafe;
  color:#1d4ed8;
}

.badge-rejected{
  background:#fee2e2;
  color:#b91c1c;
}

.badge-registered{
  background:#ede9fe;
  color:#6d28a8;
}

.badge-checked-in{
  background:#dcfce7;
  color:#15803d;
}

.badge-checked-out{
  background:#e5e7eb;
  color:#4b5563;
}

/* FORM */

.form-section{
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  margin-bottom:18px;
}

.form-section-title{
  background:#f8f9fc;
  border-bottom:1px solid var(--border);
  padding:15px 18px;
  font-weight:850;
}

.form-number{
  width:28px;
  height:28px;
  background:var(--primary);
  color:white;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  margin-right:8px;
  font-size:11px;
}

.form-grid{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:17px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.full{
  grid-column:1/-1;
}

label{
  color:#4b5563;
  font-size:12px;
  font-weight:750;
}

input,select,textarea{
  width:100%;
  border:1px solid #dfe3eb;
  background:#fbfcfe;
  color:var(--text);
  border-radius:9px;
  padding:11px 12px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(99,91,255,.08);
}

textarea{
  min-height:105px;
  resize:vertical;
}

.check-row{
  display:flex;
  align-items:flex-start;
  gap:10px;
  line-height:1.5;
}

.check-row input{
  width:auto;
  margin-top:3px;
}

.form-footer{
  padding:20px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

/* PROCESS */

.process-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.process-card{
  background:#f8f9fc;
  border:1px solid var(--border);
  border-radius:13px;
  padding:18px;
}

.process-number{
  font-size:12px;
  color:var(--primary);
  font-weight:900;
}

.process-card h3{
  font-size:14px;
  margin:8px 0 5px;
}

.process-card p{
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:45px;
  color:#8993a5;
}

.empty-icon{
  font-size:38px;
  margin-bottom:10px;
}

/* MODAL */

.modal-overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(15,23,42,.55);
  backdrop-filter:blur(5px);
  z-index:100;
  padding:20px;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:18px;
  box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.modal-header{
  padding:19px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  width:34px;
  height:34px;
  background:#f0f2f7;
  border-radius:9px;
  font-size:18px;
}

.modal-body{
  padding:22px;
  line-height:1.7;
}

/* TOAST */

.toast{
  position:fixed;
  right:25px;
  bottom:25px;
  background:#111827;
  color:white;
  padding:13px 18px;
  border-radius:10px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
  z-index:200;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* MOBILE */

@media(max-width:1050px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .process-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:750px){

  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 15px;
  }

  .top-right{
    display:none;
  }

  .content{
    padding:16px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .process-grid{
    grid-template-columns:1fr;
  }

  .hero{
    padding:25px;
  }

  .hero h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

  <div class="logo">
    Office<span>Flow</span>
  </div>

  <div class="menu-title">Main</div>

  <button class="nav-btn active"
    onclick="showPage('dashboard',this)">
    <span class="icon">▦</span>
    Dashboard
  </button>

  <button class="nav-btn"
    onclick="showPage('appointments',this)">
    <span class="icon">📅</span>
    Appointments
  </button>

  <button class="nav-btn"
    onclick="showPage('visitors',this)">
    <span class="icon">👤</span>
    Visitors
  </button>

  <button class="nav-btn"
    onclick="showPage('employees',this)">
    <span class="icon">👥</span>
    Employees
  </button>

  <div class="menu-title">Management</div>

  <button class="nav-btn"
    onclick="showPage('visitorForm',this)">
    <span class="icon">📝</span>
    Visitor Form
  </button>

  <button class="nav-btn"
    onclick="showPage('tasks',this)">
    <span class="icon">✓</span>
    Tasks
  </button>

  <button class="nav-btn"
    onclick="showPage('settings',this)">
    <span class="icon">⚙</span>
    Settings
  </button>

</aside>

<!-- MAIN -->

<main class="main">

<header class="topbar">

  <div style="display:flex;align-items:center;gap:12px">

    <button class="mobile-menu"
      onclick="toggleSidebar()">
      ☰
    </button>

    <div class="page-title" id="pageTitle">
      Dashboard
    </div>

  </div>

  <div class="top-right">
    Office Visitor Management
  </div>

</header>

<section class="content" id="content"></section>

</main>

<!-- MODAL -->

<div class="modal-overlay" id="modal">

  <div class="modal">

    <div class="modal-header">

      <strong id="modalTitle">
        Details
      </strong>

      <button class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="modal-body"
      id="modalBody">
    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   STORAGE
========================================================= */

const STORAGE={
  appointments:"officeflow_appointments",
  visitors:"officeflow_visitors",
  employees:"officeflow_employees",
  tasks:"officeflow_tasks"
};

let appointments=load(STORAGE.appointments);
let visitors=load(STORAGE.visitors);
let employees=load(STORAGE.employees);
let tasks=load(STORAGE.tasks);

function load(key){

  try{
    return JSON.parse(localStorage.getItem(key)) || [];
  }catch{
    return [];
  }

}

function save(){

  localStorage.setItem(
    STORAGE.appointments,
    JSON.stringify(appointments)
  );

  localStorage.setItem(
    STORAGE.visitors,
    JSON.stringify(visitors)
  );

  localStorage.setItem(
    STORAGE.employees,
    JSON.stringify(employees)
  );

  localStorage.setItem(
    STORAGE.tasks,
    JSON.stringify(tasks)
  );

}

/* =========================================================
   DEFAULT EMPLOYEES
========================================================= */

if(!employees.length){

  employees=[
    {
      id:"EMP-001",
      name:"Alex Johnson",
      position:"Office Manager",
      department:"Management",
      email:"alex@office.com"
    },
    {
      id:"EMP-002",
      name:"Maria Garcia",
      position:"HR Manager",
      department:"Human Resources",
      email:"maria@office.com"
    },
    {
      id:"EMP-003",
      name:"Daniel Smith",
      position:"IT Specialist",
      department:"IT",
      email:"daniel@office.com"
    }
  ];

  save();

}

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function generateID(prefix,array){

  const year=new Date().getFullYear();

  return prefix+"-"+year+"-"+
    String(array.length+1).padStart(5,"0");

}

function today(){

  return new Date()
    .toISOString()
    .split("T")[0];

}

function formatDate(date){

  if(!date)return "-";

  return new Date(date+"T00:00:00")
    .toLocaleDateString("en-GB",{
      day:"2-digit",
      month:"short",
      year:"numeric"
    });

}

function showToast(message){

  const toast=document.getElementById("toast");

  toast.textContent=message;
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2500);

}

function statusBadge(status){

  let cls="badge-"+status
    .toLowerCase()
    .replaceAll(" ","-");

  return `
    <span class="badge ${cls}">
      ${escapeHTML(status)}
    </span>
  `;

}

/* =========================================================
   NAVIGATION
========================================================= */

const pageTitles={
  dashboard:"Dashboard",
  appointments:"Appointments",
  visitors:"Visitors",
  employees:"Employees",
  visitorForm:"Visitor Form",
  tasks:"Tasks",
  settings:"Settings"
};

function showPage(page,button){

  document.querySelectorAll(".nav-btn")
    .forEach(btn=>btn.classList.remove("active"));

  if(button){
    button.classList.add("active");
  }

  document.getElementById("pageTitle")
    .textContent=pageTitles[page];

  document.getElementById("sidebar")
    .classList.remove("open");

  if(page==="dashboard")renderDashboard();
  if(page==="appointments")renderAppointments();
  if(page==="visitors")renderVisitors();
  if(page==="employees")renderEmployees();
  if(page==="visitorForm")renderVisitorForm();
  if(page==="tasks")renderTasks();
  if(page==="settings")renderSettings();

}

function toggleSidebar(){

  document.getElementById("sidebar")
    .classList.toggle("open");

}

/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){

  const pending=appointments.filter(
    x=>x.status==="Pending"
  ).length;

  const approved=appointments.filter(
    x=>x.status==="Approved"
  ).length;

  const registered=visitors.length;

  const todayVisits=visitors.filter(
    x=>x.date===today()
  ).length;

  document.getElementById("content").innerHTML=`

    <div class="hero">

      <h1>Welcome to OfficeFlow 👋</h1>

      <p>
        Professional visitor management from the first
        appointment request to final check-out.
      </p>

      <div class="hero-buttons">

        <button class="hero-btn hero-primary"
          onclick="openVisitorForm()">
          👤 VISITOR FORM
        </button>

        <button class="hero-btn hero-secondary"
          onclick="showPage('appointments')">
          📅 APPOINTMENTS
        </button>

      </div>

    </div>

    <div class="stats">

      <div class="stat-card">

        <div class="stat-top">

          <div class="stat-label">
            Pending Appointments
          </div>

          <div class="stat-icon">⏳</div>

        </div>

        <div class="stat-number">
          ${pending}
        </div>

      </div>

      <div class="stat-card">

        <div class="stat-top">

          <div class="stat-label">
            Approved
          </div>

          <div class="stat-icon">✓</div>

        </div>

        <div class="stat-number">
          ${approved}
        </div>

      </div>

      <div class="stat-card">

        <div class="stat-top">

          <div class="stat-label">
            Registered Visitors
          </div>

          <div class="stat-icon">👤</div>

        </div>

        <div class="stat-number">
          ${registered}
        </div>

      </div>

      <div class="stat-card">

        <div class="stat-top">

          <div class="stat-label">
            Today's Visits
          </div>

          <div class="stat-icon">📅</div>

        </div>

        <div class="stat-number">
          ${todayVisits}
        </div>

      </div>

    </div>

    <div class="panel">

      <div class="panel-head">

        <div>

          <div class="panel-title">
            Visitor Registration Process
          </div>

          <div class="panel-subtitle">
            Every visitor goes through these steps.
          </div>

        </div>

      </div>

      <div class="panel-body">

        <div class="process-grid">

          <div class="process-card">
            <div class="process-number">01</div>
            <h3>Appointment</h3>
            <p>
              Visitor submits an appointment request.
            </p>
          </div>

          <div class="process-card">
            <div class="process-number">02</div>
            <h3>Approval</h3>
            <p>
              Office staff checks and approves the request.
            </p>
          </div>

          <div class="process-card">
            <div class="process-number">03</div>
            <h3>Registration</h3>
            <p>
              Approved visitor completes the detailed form.
            </p>
          </div>

          <div class="process-card">
            <div class="process-number">04</div>
            <h3>Check-In</h3>
            <p>
              Visitor arrives and is checked into the office.
            </p>
          </div>

          <div class="process-card">
            <div class="process-number">05</div>
            <h3>Check-Out</h3>
            <p>
              Visit is completed and visitor checks out.
            </p>
          </div>

        </div>

      </div>

    </div>

    <div class="panel">

      <div class="panel-head">

        <div class="panel-title">
          Recent Appointments
        </div>

        <button class="btn btn-primary btn-sm"
          onclick="showPage('appointments')">
          View All
        </button>

      </div>

      <div class="table-wrap">

        ${appointmentTable(
          appointments.slice().reverse().slice(0,5)
        )}

      </div>

    </div>

  `;

}

/* =========================================================
   OPEN VISITOR FORM
========================================================= */

function openVisitorForm(){

  document.getElementById("pageTitle")
    .textContent="Visitor Form";

  renderVisitorForm();

}

/* =========================================================
   VISITOR / APPOINTMENT FORM
========================================================= */

function renderVisitorForm(approved=null){

  const edit=!!approved;

  document.getElementById("content").innerHTML=`

    <div class="panel">

      <div class="panel-head">

        <div>

          <div class="panel-title">
            ${edit
              ?"New Visitor Registration"
              :"Visitor Appointment Form"
            }
          </div>

          <div class="panel-subtitle">

            ${edit
              ?"Appointment approved. Complete all required visitor information."
              :"Submit an appointment first. Registration becomes available after approval."
            }

          </div>

        </div>

        ${edit ? `
          <span class="badge badge-approved">
            APPOINTMENT APPROVED
          </span>
        `:""}

      </div>

      <form onsubmit="${
        edit

        `).join("")}

/* =========================================================
   APPROVE / REJECT
========================================================= */

function approveAppointment(id){

  const appointment=appointments.find(
    x=>x.appointmentId===id
  );

  if(!appointment)return;

  appointment.status="Approved";

  appointment.approvedAt=
    new Date().toISOString();

  save();

  showToast(
    "Appointment approved ✓"
  );

  renderAppointments();

}

function rejectAppointment(id){

  const appointment=appointments.find(
    x=>x.appointmentId===id
  );

  if(!appointment)return;

  appointment.status="Rejected";

  appointment.rejectedAt=
    new Date().toISOString();

  save();

  showToast(
    "Appointment rejected"
  );

  renderAppointments();

}

/* =========================================================
   START REGISTRATION
========================================================= */

function startRegistration(id){

  const appointment=appointments.find(
    x=>x.appointmentId===id
  );

  if(!appointment)return;

  if(appointment.status!=="Approved"){

    showToast(
      "This appointment is not approved yet."
    );

    return;

  }

  document.getElementById("pageTitle")
    .textContent="New Registration";

  renderVisitorForm(appointment);

}

  visitor.status="Checked In";

  visitor.checkedInAt=
    new Date().toISOString();

  save();

  showToast(
    visitor.name+" checked in ✓"

  renderVisitors();

}

function checkOut(id){

  const visitor=visitors.find(

  visitor.status="Checked Out";

  visitor.checkedOutAt=
    new Date().toISOString();

    visitor.name+" checked out"

  renderVisitors();

/* =========================================================
   EMPLOYEES
========================================================= */

function renderEmployees(){

  document.getElementById("content").innerHTML=`

    <div class="panel">

      <div class="panel-head">

        <div>

          <div class="panel-title">
            Employees
          </div>

          <div class="panel-subtitle">
            People available for visitor appointments.
          </div>

        </div>

        <button
          class="btn btn-primary"
          onclick="addEmployee()">
          + Add Employee
        </button>

      </div>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>Name</th>
              <th>Position</th>
              <th>Department</th>
              <th>Email</th>
            </tr>

          </thead>

          <tbody>

            ${employees.map(e=>`

              <tr>

                <td>
                  <strong>
                    ${escapeHTML(e.name)}
                  </strong>
                </td>

                <td>
                  ${escapeHTML(e.position)}
                </td>

                <td>
                  ${escapeHTML(e.department)}
                </td>

                <td>
                  ${escapeHTML(e.email || "-")}
                </td>

              </tr>

            `).join("")}

          </tbody>

        </table>

      </div>

    </div>

  `;

}

function addEmployee(){

  const name=prompt("Employee name:");

  if(!name)return;

  const position=prompt("Position:");

  if(!position)return;

  const department=prompt("Department:");

  if(!department)return;

  const email=prompt("Email:");

  employees.push({

    id:generateID("EMP",employees),

    name:name,

    position:position,

    department:department,

    email:email || ""

  });

  save();

  showToast("Employee added ✓");

  renderEmployees();

}

/* =========================================================
   TASKS
========================================================= */

function renderTasks(){

  if(!tasks.length){

    tasks=[
      {
        id:1,
        name:"Review visitor requests",
        done:false
      },
      {
        id:2,
        name:"Check today's appointments",
        done:false
      },
      {
        id:3,
        name:"Prepare meeting room",
        done:true
      }
    ];

    save();

  }

  document.getElementById("content").innerHTML=`

    <div class="panel">

      <div class="panel-head">

        <div class="panel-title">
          Office Tasks
        </div>

        <button
          class="btn btn-primary"
          onclick="addTask()">
          + Add Task
        </button>

      </div>

      <div class="panel-body">

        ${tasks.map(task=>`

          <div style="
            display:flex;
            align-items:center;
            gap:12px;
            padding:14px 0;
            border-bottom:1px solid #eee;
          ">

            <input
              type="checkbox"
              style="width:auto"
              ${task.done?"checked":""}
              onchange="toggleTask(${task.id})">

            <span style="
              text-decoration:${task.done?"line-through":"none"};
              color:${task.done?"#9ca3af":"#172033"};
            ">
              ${escapeHTML(task.name)}
            </span>

          </div>

        `).join("")}

      </div>

    </div>

  `;

}

function addTask(){

  const name=prompt("Task name:");

  if(!name)return;

  tasks.push({
    id:Date.now(),
    name:name,
    done:false
  });

  save();

  renderTasks();

}

function toggleTask(id){

  const task=tasks.find(
    x=>x.id===id
  );

  if(!task)return;

  task.done=!task.done;

  save();

  renderTasks();

}

    <div class="panel">

        </div>

      <div class="panel-body">

        <h3>
          OfficeFlow Visitor Management

          line-height:1.6;
        ">

          information in your browser.

        <br>

        </button>

function resetData(){

  if(!confirm(
    "Delete all appointment and visitor data?"
  ))return;

  appointments=[];
  visitors=[];

  save();

  showToast(
    "Visitor data deleted"
  );

  renderDashboard();

}

/* =========================================================
   MODAL
========================================================= */

function closeModal(){

  document.getElementById("modal")
    .classList.remove("show");

}

document.getElementById("modal")
.addEventListener("click",function(event){

  if(event.target===this){
    closeModal();
  }

});

/* =========================================================
   START
========================================================= */

renderDashboard();

</script>
